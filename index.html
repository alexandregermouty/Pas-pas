<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pas à pas">
<meta name="application-name" content="Pas à pas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Pas à pas — Lan Anh's French learning app, from B1 to B2 to C1, with DELF and DALF practice.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Pas à pas · Lan Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<script>try{var s=JSON.parse(localStorage.getItem("pap:state")||"{}"),t=(s.set&&s.set.theme)||"auto",l=t==="light"||(t==="auto"&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.dataset.theme=l?"light":"dark";}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{
  --bg:#0E1626;--bg2:#121C30;--s1:#17223A;--s2:#1E2B48;--s3:#26365A;
  --ink:#F5EFE6;--ink-rgb:245,239,230;--dim:rgba(245,239,230,.66);--dimmer:rgba(245,239,230,.42);
  --line:rgba(245,239,230,.10);--line2:rgba(245,239,230,.18);
  --rose:#F28B9C;--rose-rgb:242,139,156;--gold:#EDBE68;--gold-rgb:237,190,104;
  --ok:#5CC9A2;--ok-rgb:92,201,162;--bad:#F2705E;--bad-rgb:242,112,94;--blue:#7DB7F2;
  --primary:var(--rose);--on-primary:#2A0F17;
  --b1:#53B8C4;--b2:#9A86F2;--c1:#EBA35E;--ex:#F28B9C;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --r:18px;--r-sm:12px;
  --ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --disp:"Fraunces","Newsreader",Georgia,serif;
  --en:"Newsreader",Georgia,"Times New Roman",serif;
}
[data-theme="light"]{
  --bg:#FAF5EE;--bg2:#F3ECE2;--s1:#FFFFFF;--s2:#F6F0E7;--s3:#ECE3D6;
  --ink:#18223A;--ink-rgb:24,34,58;--dim:rgba(24,34,58,.68);--dimmer:rgba(24,34,58,.45);
  --line:rgba(24,34,58,.10);--line2:rgba(24,34,58,.18);
  --rose:#D9546C;--rose-rgb:217,84,108;--gold:#B7811F;--gold-rgb:183,129,31;
  --ok:#1E9B70;--ok-rgb:30,155,112;--bad:#D2472F;--bad-rgb:210,71,47;--blue:#2E6FB8;
  --primary:#1F2E57;--on-primary:#FFF8EE;
  --b1:#1F8E9C;--b2:#6B55D6;--c1:#C7741F;--ex:#D9546C;
  --shadow:0 8px 24px rgba(24,34,58,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose)}
.wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom))}
body.insession .wrap{padding-bottom:40px}

/* header */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.brand h1{margin:0;font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:none;
  align-items:center;justify-content:center;flex-shrink:0}
.hdr-back.on{display:inline-flex}
.hdr-back svg,.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:inline-flex;align-items:center;justify-content:center}
body.insession .app-header{display:none}

/* bottom nav */
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;
  display:flex;justify-content:space-around;padding:6px;border-radius:22px;z-index:20;
  background:rgba(var(--ink-rgb),.06);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line2);box-shadow:var(--shadow)}
[data-theme="dark"] #nav{background:rgba(23,34,58,.82)}
[data-theme="light"] #nav{background:rgba(255,255,255,.86)}
#nav button{flex:1;border:0;background:transparent;color:var(--dimmer);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px 5px;border-radius:16px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
#nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-selected="true"]{color:var(--ink);background:rgba(var(--rose-rgb),.16)}
#nav button[aria-selected="true"] svg{stroke:var(--rose)}
body.insession #nav{display:none}

/* type */
h2.pg{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:-.015em;margin:14px 0 4px;line-height:1.15}
.pg-sub{color:var(--dim);margin:0 0 14px;font-size:14px}
h3.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.muted{color:var(--dim)}.small{font-size:13px}.tiny{font-size:12px}
.en{font-family:var(--en);font-style:italic;color:var(--dim)}
.fr{font-weight:500}
.vn{font-family:var(--ui)}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h4{margin:0 0 6px;font-size:16px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 20px;margin:10px 0 14px;color:#fff;
  background:linear-gradient(135deg,#25365F 0%,#3B2D5C 55%,#6A3550 100%);box-shadow:var(--shadow)}
[data-theme="light"] .hero{background:linear-gradient(135deg,#1F2E57 0%,#3A2F66 60%,#8A3A5B 100%)}
.hero .stripe{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
.hero .stripe i{flex:1}
.hero .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero h3{font-family:var(--disp);font-size:24px;font-weight:600;margin:6px 0 4px;line-height:1.15}
.hero p{margin:0 0 14px;opacity:.85;font-size:14px}
.hero .btn.primary{background:#FFE7C2;color:#2A1A0F}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--s2);color:var(--ink);border:1px solid var(--line2);transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:600;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin:8px 0 6px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
.lv-B1{--lv:var(--b1)}.lv-B2{--lv:var(--b2)}.lv-C1{--lv:var(--c1)}.lv-EX{--lv:var(--ex)}
.badge.lv{background:color-mix(in srgb,var(--lv) 22%,transparent);color:var(--lv)}

/* tiles */
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:var(--r);padding:14px;border:1px solid var(--line);
  background:var(--s1);box-shadow:var(--shadow);min-height:96px;position:relative;width:100%}
.tile .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--s2)}
.tile b{font-size:14.5px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--dim);line-height:1.3}
.tile .best{position:absolute;top:10px;right:12px;font-size:11px;color:var(--dim);font-weight:700}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin:8px 0;width:100%;text-align:left}
.lrow .ic{width:34px;height:34px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:14.5px}
.lrow .tx span{display:block;font-size:12.5px;color:var(--dim)}
.lrow .end{font-size:12px;color:var(--dim);font-weight:700;flex-shrink:0}
.chev{width:16px;height:16px;stroke:var(--dimmer);fill:none;stroke-width:2}

/* plan */
.plan .step{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.plan .step:first-of-type{border-top:0}
.plan .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.plan .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.plan .step.done .tx b{text-decoration:line-through;opacity:.6}
.plan .tx{flex:1}.plan .tx b{display:block;font-size:14.5px}.plan .tx span{font-size:12.5px;color:var(--dim)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-family:var(--disp);font-weight:600}
.stat span{font-size:11.5px;color:var(--dim)}

/* path */
.track-h{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
.track-h .bar{width:6px;height:28px;border-radius:4px;background:var(--lv)}
.track-h b{font-size:16px}.track-h span{font-size:12.5px;color:var(--dim);display:block}
.path{position:relative;padding-left:22px}
.path::before{content:"";position:absolute;left:17px;top:10px;bottom:10px;width:2px;background:var(--line2);border-radius:2px}
.node{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px 11px 30px;margin:8px 0;border-radius:14px;
  background:var(--s1);border:1px solid var(--line)}
.node .num{position:absolute;left:-17px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dim)}
.node.done .num{background:var(--lv);border-color:var(--lv);color:#fff}
.node.next .num{border-color:var(--lv);color:var(--lv);box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 22%,transparent)}
.node.due .num::after{content:"↺";position:absolute;top:-8px;right:-8px;background:var(--gold);color:#241500;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}
.node .tx{flex:1;min-width:0}.node .tx b{display:block;font-size:14.5px;line-height:1.25}.node .tx span{font-size:12.5px;color:var(--dim)}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;opacity:.22}
.resume-chip{font-size:11px;font-weight:800;background:rgba(var(--gold-rgb),.18);color:var(--gold);padding:3px 7px;border-radius:999px}
.progress{height:8px;border-radius:8px;background:var(--s3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ok),var(--gold))}

/* lesson intro */
.lhead{border-radius:24px;padding:20px;margin:10px 0;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--lv) 85%,#000) 0%,color-mix(in srgb,var(--lv) 55%,#1a1030) 100%)}
.lhead .k{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.lhead h3{font-family:var(--disp);font-size:25px;font-weight:600;margin:6px 0 2px;line-height:1.15}
.lhead p{margin:0;opacity:.88}
.rule-h{font-family:var(--disp);font-size:20px;line-height:1.3;font-weight:600;margin:0 0 10px}
.pts{margin:0;padding-left:18px}.pts li{margin:6px 0}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.ex .spk{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:rgba(var(--rose-rgb),.14);display:flex;align-items:center;justify-content:center;color:var(--rose)}
.ex .spk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.ex .fr{display:block;font-size:15.5px}.ex .en{display:block;font-size:14px}
.callout{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;border:1px solid var(--line)}
.callout.warn{background:rgba(var(--gold-rgb),.10);border-color:rgba(var(--gold-rgb),.35)}
.callout.vn{background:rgba(var(--ok-rgb),.08);border-color:rgba(var(--ok-rgb),.30)}
.callout .k{font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:4px}
.callout.warn .k{color:var(--gold)}.callout.vn .k{color:var(--ok)}
details.more{margin-top:8px}details.more summary{cursor:pointer;color:var(--rose);font-weight:700;font-size:14px}

/* flashcards */
.fc-wrap{perspective:1200px;margin:12px 0}
.fc{position:relative;height:300px;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background:var(--s1);border:1px solid var(--line);box-shadow:var(--shadow)}
.fc .back{transform:rotateY(180deg)}
.fc .w{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.2}
.fc .g{font-family:var(--en);font-style:italic;font-size:20px;color:var(--dim);margin-top:8px}
.fc .exs{font-size:14.5px;margin-top:16px}.fc .exs .en{font-size:13.5px}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;margin:6px 0 16px;min-height:44px}
.sess-top .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sess-top .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.sess-top .progress{flex:1;height:10px}
.sess-top .cnt{font-size:12px;color:var(--dim);font-weight:700;min-width:44px;text-align:right}
.qk{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--rose);margin-bottom:6px}
.qp{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.3;margin:0 0 6px}
.qs{font-size:19px;line-height:1.55;font-weight:500;margin:4px 0}
.qs .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--rose);color:var(--rose);text-align:center}
.qen{font-family:var(--en);font-style:italic;color:var(--dim);font-size:15.5px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.opt{text-align:left;padding:14px 16px;border-radius:15px;border:1.5px solid var(--line2);background:var(--s1);font-size:16px;line-height:1.4;font-weight:500;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--s1))}
.opt.right{border-color:var(--ok);background:rgba(var(--ok-rgb),.14)}
.opt.wrong{border-color:var(--bad);background:rgba(var(--bad-rgb),.12)}
.opt[disabled]{pointer-events:none;color:inherit;opacity:1}
.bigplay{width:84px;height:84px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;margin:16px auto;box-shadow:var(--shadow)}
.bigplay svg{width:34px;height:34px;fill:currentColor}
.slowbtn{display:block;margin:-6px auto 6px;font-size:13px}
.inp{width:100%;padding:14px 15px;border-radius:15px;border:1.5px solid var(--line2);background:var(--s1);font-size:17px;outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.accents button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--s2);font-size:16px;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:15px;border:1.5px dashed var(--line2);margin:12px 0}
.tiles.bank{border-style:solid;border-color:transparent;background:transparent;padding:0}
.tk{padding:9px 12px;border-radius:11px;background:var(--s1);border:1px solid var(--line2);font-size:16px;font-weight:500;box-shadow:0 2px 0 var(--line2)}
.tk.used{opacity:.25;pointer-events:none}
.tk.bad{border-color:var(--bad);background:rgba(var(--bad-rgb),.12)}
.tk.pick{border-color:var(--gold);background:rgba(var(--gold-rgb),.15)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.match .opt{padding:12px;font-size:15px;min-height:54px}
.match .opt.gone{opacity:.2;pointer-events:none}
.chatb{display:flex;gap:8px;margin:12px 0}
.chatb .bub{background:var(--s2);border-radius:18px 18px 18px 6px;padding:11px 14px;max-width:85%;font-size:16px}
.chatb .who{font-size:12px;color:var(--dim);font-weight:700}
.checkbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));margin-top:18px}
.sheet-fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;
  background:var(--s1);box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease}
.sheet-fb.on{transform:none}
.sheet-fb .in{max-width:680px;margin:0 auto}
.sheet-fb h4{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet-fb.ok h4{color:var(--ok)}.sheet-fb.no h4{color:var(--bad)}
.sheet-fb .ans{font-size:16px;font-weight:600;margin:4px 0}
.sheet-fb .why{font-size:14px;color:var(--dim);margin:6px 0 12px;max-height:30vh;overflow:auto}
.flashwash{animation:wash .5s ease}
@keyframes wash{0%{background:rgba(var(--ok-rgb),.18)}100%{background:transparent}}
.shake{animation:shake .32s}
@keyframes shake{20%,80%{transform:translateX(-3px)}40%,60%{transform:translateX(5px)}}

/* results */
.ring{width:150px;height:150px;margin:16px auto;display:block}
.res-h{text-align:center;font-family:var(--disp);font-size:28px;margin:4px 0}
.res-stars{text-align:center;font-size:34px;color:var(--gold);letter-spacing:6px}
.res-stars i{font-style:normal;opacity:.2}

/* reading */
.reading p{font-size:16.5px;line-height:1.7;margin:0 0 12px}
.reading .hl{background:rgba(var(--gold-rgb),.22);border-radius:4px;padding:0 2px}
.script .line{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.script .line b{min-width:70px;font-size:13px;color:var(--dim)}
.timer{font-family:var(--disp);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.wc{font-size:13px;font-weight:700;color:var(--dim)}
.wc.okc{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--rose);flex-shrink:0}
table.fmt{width:100%;border-collapse:collapse;font-size:13.5px}
table.fmt th,table.fmt td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
table.fmt th{font-size:12px;color:var(--dim);font-weight:700}
.conj td{padding:5px 8px}

/* scrim sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3)}
.heat i.l1{background:rgba(var(--ok-rgb),.35)}.heat i.l2{background:rgba(var(--ok-rgb),.65)}.heat i.l3{background:var(--ok)}
.rec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .3s}
#splash img{width:92px;height:92px;border-radius:50%;animation:pulse 1.4s infinite}
#splash.off{opacity:0;pointer-events:none}
.hide{display:none!important}

</style>
</head>

<script>
/* ── core.js ── */
/* ═══════════════════════════════════════════════════════════════════

"use strict";
const APP_VERSION = "1.0";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const uniq = a => Array.from(new Set(a));
const DAY = 864e5;
const dayKey = d => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

/* ── storage ─────────────────────────────────────────────────────── */
const KEY = "pap:state";
const DEFAULT = () => ({
  v: 1, created: Date.now(),
  lessons: {},      // id → {stars, best, done, last, due, reviews, runs}
  cards: {},        // key → {b, due, r, w}
  seen: {},         // itemKey → count
  resume: {},       // lessonId → saved session
  mistakes: [],     // {t, q, given, cat, lesson, type}
  days: {},         // yyyy-mm-dd → answers
  plan: {},         // yyyy-mm-dd → {rev, les, prac}
  best: {},         // toolId → best %
  exam: {},         // taskId → {score, max, date}
  drafts: {},       // writing drafts
  cando: {},        // manual ticks
  level: "B1",
  set: { theme: "auto", voice: "", rate: 0.95, sound: true, vibe: true, examLevel: "B1", examDate: "", name: "Lan Anh" }
});
let S;
function load() {
  try { S = Object.assign(DEFAULT(), JSON.parse(localStorage.getItem(KEY) || "{}")); S.set = Object.assign(DEFAULT().set, S.set || {}); }
  catch (e) { S = DEFAULT(); }
}
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Storage is full — export your progress in Moi → Settings"); } }, 120); }
function saveNow() { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }

/* ── theme ───────────────────────────────────────────────────────── */
function applyTheme() {
  const t = S.set.theme;
  const light = t === "light" || (t === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  const m = $('meta[name="theme-color"]'); if (m) m.content = light ? "#FAF5EE" : "#0E1626";
}

/* ── text normalisation and answer checking ─────────────────────── */
function norm(s) {
  return String(s ?? "").toLowerCase()
    .replace(/[’`´ʼ]/g, "'").replace(/[«»"“”]/g, "").replace(/ | /g, " ")
    .replace(/\s*'\s*/g, "'").replace(/\s*-\s*/g, "-")
    .replace(/\s*([,;:!?.…])\s*/g, "$1 ").replace(/[\s,;:!?.…]+$/g, "")
    .replace(/\s+/g, " ").trim();
}
const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae");
function check(given, accepts) {
  const g = norm(given);
  const list = [].concat(accepts).flatMap(a => String(a).split("|")).map(norm);
  if (list.includes(g)) return { ok: true };
  const gd = deacc(g);
  if (list.some(a => deacc(a) === gd)) return { ok: true, accent: true };
  return { ok: false };
}
function wordsOf(s) { return deacc(norm(s)).replace(/[,;:!?.…]/g, " ").split(/[\s']+/).filter(Boolean); }
function similarity(a, b) {
  const A = wordsOf(a), B = wordsOf(b);
  if (!A.length && !B.length) return 1;
  const d = Array.from({ length: A.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= B.length; j++) d[0][j] = j;
  for (let i = 1; i <= A.length; i++) for (let j = 1; j <= B.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1));
  return 1 - d[A.length][B.length] / Math.max(A.length, B.length);
}
function countWords(t) { return (String(t).replace(/['’]/g, "' ").match(/[A-Za-zÀ-ÿœŒæÆ0-9]+(?:-[A-Za-zÀ-ÿœŒ0-9]+)*/g) || []).length; }
function tokenize(s) {
  const raw = String(s).replace(/\s+/g, " ").trim().split(" ");
  const out = [];
  raw.forEach(w => { if (/^[?!:;»…]+$/.test(w) && out.length) out[out.length - 1] += " " + w; else if (/^«$/.test(w)) out.push(w); else if (out.length && /^«$/.test(out[out.length - 1])) out[out.length - 1] += " " + w; else out.push(w); });
  return out;
}

/* ── audio: speech synthesis ─────────────────────────────────────── */
const TTS = {
  ok: typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined",
  voices: [], fr: [], seq: 0,
  load() {
    if (!this.ok) return;
    const all = speechSynthesis.getVoices() || [];
    this.voices = all;
    const score = v => (v.lang === "fr-FR" || v.lang === "fr_FR" ? 50 : /^fr/i.test(v.lang) ? 10 : -100)
      + (/google/i.test(v.name) ? 8 : 0) + (/premium|enhanced|natural|neural|online/i.test(v.name) ? 12 : 0)
      + (/thomas|audrey|aurélie|amélie|marie|denise|henri|vivienne|remy|rémy|eloise|julie/i.test(v.name) ? 4 : 0)
      + (/canada|québec|belg|suisse|switz/i.test(v.name + v.lang) ? -6 : 0);
    this.fr = all.filter(v => /^fr/i.test(v.lang)).sort((a, b) => score(b) - score(a));
  },
  voice(i = 0) {
    if (!this.fr.length) this.load();
    if (S.set.voice) { const v = this.fr.find(x => x.voiceURI === S.set.voice); if (v) return i ? (this.fr.find(x => x !== v && x.lang === v.lang) || v) : v; }
    return this.fr[i] || this.fr[0] || null;
  },
  stop() { if (this.ok) { this.seq++; speechSynthesis.cancel(); } },
  speak(text, o = {}) {
    if (!this.ok || !text) { o.onend && setTimeout(o.onend, 50); return; }
    if (!o.keep) { this.seq++; speechSynthesis.cancel(); }
    const u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, "…"));
    const v = this.voice(o.alt ? 1 : 0); if (v) u.voice = v;
    u.lang = (v && v.lang) || "fr-FR";
    u.rate = (o.rate || S.set.rate || 0.95) * (o.slow ? 0.72 : 1);
    u.pitch = o.pitch || (o.alt && this.fr.length < 2 ? 0.82 : 1);
    if (o.onend) { u.onend = o.onend; u.onerror = o.onend; }
    speechSynthesis.speak(u);
    try { speechSynthesis.resume(); } catch (e) { }
  },
  /* lines: [[speaker,text],...] — alternates voices by speaker */
  play(lines, o = {}) {
    if (!this.ok) { o.onend && o.onend(); return; }
    this.stop(); const my = this.seq; const spk = uniq(lines.map(l => l[0]));
    let i = 0;
    const next = () => {
      if (my !== this.seq) return;
      if (i >= lines.length) { o.onend && o.onend(); return; }
      const [who, txt] = lines[i++]; o.online && o.online(i - 1);
      this.speak(txt, { keep: true, alt: spk.indexOf(who) % 2 === 1, rate: o.rate, onend: () => setTimeout(next, o.gap ?? 380) });
    };
    next();
  }
};
if (TTS.ok) { TTS.load(); speechSynthesis.onvoiceschanged = () => TTS.load(); }
const say = (t, o) => TTS.speak(t, o);

/* ── speech recognition and recording ───────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenOnce(cb) {
  if (!SR) return cb(null, "unsupported");
  const r = new SR(); r.lang = "fr-FR"; r.interimResults = false; r.maxAlternatives = 3;
  let done = false;
  r.onresult = e => { done = true; const alts = Array.from(e.results[0]).map(a => a.transcript); cb(alts); };
  r.onerror = e => { if (!done) { done = true; cb(null, e.error); } };
  r.onend = () => { if (!done) { done = true; cb(null, "nothing"); } };
  try { r.start(); } catch (e) { cb(null, "busy"); }
  return r;
}
const IDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const q = indexedDB.open("pap-audio", 1); q.onupgradeneeded = () => q.result.createObjectStore("rec"); q.onsuccess = () => { this.db = q.result; res(this.db); }; q.onerror = () => rej(q.error); }); },
  async put(k, v) { const db = await this.open(); return new Promise(r => { const t = db.transaction("rec", "readwrite"); t.objectStore("rec").put(v, k); t.oncomplete = () => r(true); t.onerror = () => r(false); }); },
  async get(k) { const db = await this.open(); return new Promise(r => { const q = db.transaction("rec").objectStore("rec").get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); }
};
const Rec = {
  mr: null, chunks: [], stream: null,
  async start() {
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast("Recording is not available in this browser"); return false; }
    try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { toast("Microphone permission was refused"); return false; }
    this.chunks = []; this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.start(); return true;
  },
  stop() {
    return new Promise(res => {
      if (!this.mr) return res(null);
      this.mr.onstop = () => { const b = new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" }); this.stream.getTracks().forEach(t => t.stop()); this.mr = null; res(b); };
      this.mr.stop();
    });
  }
};

/* ── feedback: sound and vibration ──────────────────────────────── */
let AC = null;
function blip(ok) {
  if (S.set.vibe && navigator.vibrate) navigator.vibrate(ok ? 12 : [20, 40, 20]);
  if (!S.set.sound) return;

L({ id: "b1-pc-imp", lvl: "B1", tr: "recit", cat: "temps", t: "Passé composé ou imparfait", en: "Background and events in a past story",

L({ id: "b1-accord", lvl: "B1", tr: "recit", cat: "accords", t: "Être ou avoir, et l'accord", en: "Choosing the auxiliary and agreeing the past participle",

      "With être, add <b>-e</b> for a woman and <b>-s</b> for a plural: <i>elle est partie, nous sommes arrivés</i>.",
      "With avoir, no agreement with the subject: <i>elle a mangé</i>.",

    warn: "Some verbs change auxiliary when they have a direct object: <i>je suis sortie</i> (I went out) but <i>j'ai sorti la poubelle</i> (I took the bin out).",
    vn: "Tiếng Việt không có giống và số ở động từ. Trong tiếng Pháp, nếu chủ ngữ là nữ thì viết <b>-e</b> (elle est allé<b>e</b>). Khi nói thường không nghe khác, nhưng khi viết DELF bị chấm lỗi." },

  gap: [["Elle est ___ à Paris en septembre.", "arrivée", "arriver", "She arrived in Paris in September.", ["arrivé", "arrivés", "arrivées"]], ["Nous nous sommes ___ en 2022.", "rencontrés|rencontrées", "rencontrer", "We met in 2022.", ["rencontré", "rencontrer", "rencontrée"]], ["La maison qu'ils ont ___ est à Nice.", "achetée", "acheter", "The house they bought is in Nice.", ["acheté", "achetés", "achetées"]], ["Mes amies sont ___ tard.", "parties", "partir", "My (female) friends left late.", ["partis", "partie", "parti"]], ["Je me suis ___ de numéro.", "trompée|trompé", "se tromper", "I dialled the wrong number.", ["trompés", "tromper", "trompées"]], ["Les messages ? Je les ai ___ ce matin.", "lus", "lire", "The messages? I read them this morning.", ["lu", "lue", "lues"]]],

L({ id: "b1-pronoms", lvl: "B1", tr: "phrase", cat: "pronoms", t: "Le, la, lui, leur", en: "Direct and indirect object pronouns",
  rule: { h: "Direct object (no preposition) → le, la, les. Indirect object (à + person) → lui, leur.",
    pts: ["Direct: <i>je vois <b>Alex</b> → je <b>le</b> vois</i>; <i>j'aime <b>ces chansons</b> → je <b>les</b> aime</i>.",
      "Indirect, with verbs built with <b>à quelqu'un</b> (parler, téléphoner, écrire, répondre, donner, demander, offrir…): <i>je parle <b>à ma mère</b> → je <b>lui</b> parle</i>.",
      "The pronoun goes <b>before the verb</b>, before the auxiliary in compound tenses, and before the infinitive: <i>je l'ai vu, je vais lui écrire</i>.",
      "Two pronouns together: <b>me/te/nous/vous → le/la/les → lui/leur</b>: <i>je te le donne, je le lui donne</i>.",
      "In a positive command, the pronoun follows with a hyphen: <i>appelle-<b>la</b>, donne-<b>lui</b>, dis-<b>le-moi</b></i>."],
    ex: [["Tu connais mes parents ? — Oui, je les connais.", "Do you know my parents? — Yes, I know them."], ["J'ai téléphoné à Claire. Je lui ai téléphoné.", "I phoned Claire. I phoned her."], ["Ce livre, je te le prête.", "This book, I'll lend it to you."], ["Écris-leur ce soir !", "Write to them tonight!"]],
    warn: "Some verbs are direct in French but not in English: <i>attendre, écouter, regarder, chercher</i> → <i>je l'attends</i> (I'm waiting <b>for</b> him). Others are indirect: <i>téléphoner à, répondre à, ressembler à</i> → <i>je lui réponds</i>.",
    vn: "Tiếng Việt thường lặp lại danh từ hoặc bỏ đi (Gặp mẹ chưa? — Gặp rồi). Tiếng Pháp phải dùng đại từ và đặt nó <b>trước động từ</b>: Je <b>l'</b>ai vue — «Tôi gặp bà <b>ấy</b> rồi»." },
  cards: [["le / la / les", "him, her, it, them (direct)", "Ce film, je l'ai vu deux fois.", "That film, I've seen it twice."], ["lui", "to him, to her", "Je lui ai envoyé un message.", "I sent him/her a message."], ["leur", "to them", "Nous leur avons offert des fleurs.", "We gave them flowers."], ["attendre quelqu'un", "to wait for someone", "Je t'attends devant la gare.", "I'm waiting for you outside the station."], ["répondre à", "to answer", "Elle ne m'a pas encore répondu.", "She hasn't answered me yet."], ["ressembler à", "to look like", "Elle ressemble à sa mère. Elle lui ressemble.", "She looks like her mother. She looks like her."], ["prêter", "to lend", "Tu peux me prêter ton stylo ?", "Can you lend me your pen?"], ["rendre", "to give back", "Je te le rends demain.", "I'll give it back to you tomorrow."]],
  sent: [["Ta sœur ? Je l'ai croisée au marché.", "Your sister? I ran into her at the market."], ["J'ai écrit à mes grands-parents et je leur ai envoyé des photos.", "I wrote to my grandparents and sent them photos."], ["Ce dossier, je vais le lire ce soir.", "This file, I'm going to read it tonight."], ["Tu peux lui dire que je serai en retard ?", "Can you tell him I'll be late?"], ["Les clés ? Je te les donne tout de suite.", "The keys? I'll give them to you right away."], ["Ne lui parle pas de la surprise !", "Don't talk to her about the surprise!"], ["Je ne les ai pas encore invités.", "I haven't invited them yet."], ["Alex m'a offert ce livre ; il me l'a offert pour mon anniversaire.", "Alex gave me this book; he gave it to me for my birthday."], ["Appelle-la avant midi.", "Call her before noon."], ["Nous l'attendons depuis vingt minutes.", "We've been waiting for him for twenty minutes."]],
  nat: [["Je lui téléphone ce soir.", "Je la téléphone ce soir.", "Téléphoner à quelqu'un → lui."], ["Je l'attends depuis une heure.", "Je lui attends depuis une heure.", "Attendre is direct: attendre quelqu'un → le/la."], ["Je le lui ai donné.", "Je lui l'ai donné.", "Order: le/la/les before lui/leur."], ["Dis-le-moi.", "Dis-moi-le.", "In a positive command: verb-le-moi."]],
  mcq: [["Tu as parlé à tes parents ? — Oui, je ___ ai parlé hier.", "leur", ["les", "lui", "leurs"], "Parler à + plural → leur (never leurs as a pronoun)."], ["Tu regardes la série ? — Oui, je ___ regarde tous les soirs.", "la", ["lui", "le", "leur"], "Regarder is direct; la série is feminine → la."], ["Le gâteau ? Je ___ ai apporté à Marie.", "le lui", ["lui le", "la lui", "le leur"], "Le (the cake) + lui (to Marie), in that order."], ["Tu as répondu à ton directeur ? — Non, je ne ___ ai pas encore répondu.", "lui", ["l'", "le", "leur"], "Répondre à quelqu'un → lui."]],
  gap: [["Mes amis ? Je ___ vois samedi.", "les", "", "My friends? I'm seeing them on Saturday.", ["leur", "lui", "leurs"]], ["Claire m'a écrit, mais je ne ___ ai pas répondu.", "lui", "", "Claire wrote to me, but I didn't answer her.", ["l'", "la", "leur"]], ["Cette chanson, je ___ adore !", "l'", "", "That song, I love it!", ["lui", "la", "le"]], ["Le contrat ? Je vous ___ envoie demain.", "l'", "", "The contract? I'll send it to you tomorrow.", ["lui", "le", "les"]], ["Tes parents ? Envoie-___ une carte !", "leur", "", "Your parents? Send them a card!", ["les", "lui", "leurs"]], ["La réunion ? Je ___ ai oubliée.", "l'", "", "The meeting? I forgot it.", ["lui", "la", "le"]]],
  fix: [["Je la ai vue hier.", "la ai", "l'ai", "Le/la elide before a vowel: je l'ai vue.", ["lui ai", "les ai"]], ["Mon frère ? Je le téléphone ce soir.", "le", "lui", "Téléphoner à quelqu'un → lui.", ["la", "les"]], ["Je vais les leurs envoyer.", "leurs", "leur", "The pronoun leur never takes an -s.", ["lui", "les"]]],
  xf: [["Replace the underlined words with pronouns: le livre, à Claire.", "J'ai prêté le livre à Claire.", "Je le lui ai prêté."], ["Make it a positive command with a pronoun.", "Tu dois appeler ta mère.", "Appelle-la.|Appelle-la !"]],
  chat: [["Tu as acheté les billets ?", "Oui, je les ai achetés ce matin.", ["Oui, je leur ai achetés ce matin.", "Oui, je lui ai acheté ce matin."], "Les billets is a direct object: les, and achetés agrees."], ["Tu as dit à Alex que le dîner est à huit heures ?", "Oui, je le lui ai dit.", ["Oui, je lui le ai dit.", "Oui, je l'ai dit lui."], "Le (that information) + lui (to Alex)."]]
});

L({ id: "b1-y-en", lvl: "B1", tr: "phrase", cat: "pronoms", t: "Les pronoms y et en", en: "Replacing places, quantities and de / à + thing",
  rule: { h: "En replaces de + something (and quantities); y replaces à + something (and places).",
    pts: ["<b>En</b> = <i>du, de la, des, de</i> + noun, or a quantity: <i>tu veux du café ? — oui, j'en veux. J'ai deux sœurs → j'en ai deux</i>.",
      "<b>En</b> with verbs built with <b>de</b>: parler de, avoir besoin de, s'occuper de: <i>j'en ai besoin</i>.",
      "<b>Y</b> = a place (à, en, chez, dans…): <i>je vais à Lyon → j'y vais</i>.",
      "<b>Y</b> with verbs built with <b>à + thing</b>: penser à, réfléchir à, s'intéresser à: <i>j'y pense</i>.",
      "For people, use <b>lui/leur</b> or <b>à lui, d'elle</b>: <i>je pense à Alex → je pense à lui</i>."],
    ex: [["Tu as des enfants ? — Non, je n'en ai pas.", "Do you have children? — No, I don't."], ["Tu vas à la banque ? — Oui, j'y vais cet après-midi.", "Are you going to the bank? — Yes, I'm going this afternoon."], ["Le mariage ? On en parle tous les jours.", "The wedding? We talk about it every day."], ["Ton examen ? N'y pense pas trop !", "Your exam? Don't think about it too much!"]],
    warn: "Keep the number with <i>en</i>: <i>j'ai trois valises → j'en ai trois</i>, not <i>je les ai trois</i>.",
    vn: "<b>y</b> và <b>en</b> không có từ tương đương trực tiếp trong tiếng Việt, vì tiếng Việt thường bỏ bổ ngữ (Đi Lyon chưa? — Đi rồi). Tiếng Pháp bắt buộc: J'<b>y</b> suis allée. Muốn bao nhiêu? — J'<b>en</b> veux deux." },
  cards: [["en", "some, of it, of them", "Des fraises ? J'en ai acheté un kilo.", "Strawberries? I bought a kilo."], ["y", "there, about it", "Paris ? J'y habite depuis deux ans.", "Paris? I've lived there for two years."], ["avoir besoin de", "to need", "Ton ordinateur ? J'en ai besoin ce soir.", "Your computer? I need it tonight."], ["penser à", "to think about", "Le voyage ? J'y pense souvent.", "The trip? I often think about it."], ["s'occuper de", "to take care of", "Les invitations ? Je m'en occupe.", "The invitations? I'll take care of them."], ["se souvenir de", "to remember", "Notre premier rendez-vous ? Je m'en souviens très bien.", "Our first date? I remember it very well."], ["tenir à", "to care about", "Cette bague ? J'y tiens beaucoup.", "This ring? It means a lot to me."], ["revenir de", "to come back from", "Le Viêt Nam ? J'en reviens à peine.", "Vietnam? I've only just come back from there."]],
  sent: [["Du pain ? Il en reste un peu.", "Bread? There's a little left."], ["Le marché ? J'y vais tous les samedis.", "The market? I go every Saturday."], ["Des photos du mariage ? On en a pris des centaines.", "Photos of the wedding? We took hundreds."], ["Ce projet ? Elle y travaille depuis six mois.", "This project? She's been working on it for six months."], ["Tu as besoin d'aide ? — Non, je n'en ai pas besoin, merci.", "Do you need help? — No, I don't, thanks."], ["La réunion de lundi ? Je n'y serai pas.", "Monday's meeting? I won't be there."], ["Le café vietnamien ? J'en bois un tous les matins.", "Vietnamese coffee? I drink one every morning."], ["La Bretagne ? Nous y sommes allés l'été dernier.", "Brittany? We went there last summer."], ["Les impôts ? Alex s'en occupe.", "Taxes? Alex deals with them."], ["Ta proposition ? J'y réfléchis encore.", "Your proposal? I'm still thinking it over."]],
  nat: [["J'ai deux frères. J'en ai deux.", "J'ai deux frères. Je les ai deux.", "With a number, use en and keep the number."], ["Je vais à Nice. J'y vais demain.", "Je vais à Nice. J'en vais demain.", "A destination is replaced by y."], ["Je pense à ma grand-mère. Je pense à elle.", "Je pense à ma grand-mère. J'y pense.", "For a person after penser à, use à + stressed pronoun."], ["Le dossier ? Je m'en occupe.", "Le dossier ? Je m'y occupe.", "S'occuper de → en."]],
  mcq: [["Tu veux du thé ? — Oui, j'___ veux bien.", "en", ["y", "le", "lui"], "Du thé (de + thing) → en."], ["Tu es déjà allée à Marseille ? — Non, je n'___ suis jamais allée.", "y", ["en", "l'", "lui"], "A place → y."], ["Tu te souviens de cette chanson ? — Oui, je m'___ souviens.", "en", ["y", "la", "lui"], "Se souvenir de → en."], ["Tu t'intéresses à la politique ? — Oui, je m'___ intéresse beaucoup.", "y", ["en", "la", "lui"], "S'intéresser à + thing → y."]],
  gap: [["Des pommes ? J'___ ai acheté trois.", "en", "", "Apples? I bought three.", ["y", "les", "lui"]], ["Le bureau ? J'___ arrive dans dix minutes.", "y", "", "The office? I'll be there in ten minutes.", ["en", "le", "lui"]], ["Ton passeport ? Tu ___ as besoin pour voyager.", "en", "", "Your passport? You need it to travel.", ["y", "le", "lui"]], ["Ce problème ? Je n'___ ai pas pensé.", "y", "", "This problem? I didn't think of it.", ["en", "le", "lui"]], ["Du fromage ? Il n'___ reste plus.", "en", "", "Cheese? There's none left.", ["y", "le", "lui"]], ["Le Japon ? Ils ___ sont partis hier.", "y", "", "Japan? They left for it yesterday.", ["en", "le", "lui"]]],
  fix: [["Des enfants ? Elle les a trois.", "les a", "en a", "A quantity is replaced by en: elle en a trois.", ["y a", "leur a"]], ["Lyon ? J'en vais la semaine prochaine.", "J'en", "J'y", "A destination is replaced by y.", ["Je le", "Je lui"]], ["Ma mère ? J'y pense souvent.", "J'y pense souvent", "Je pense souvent à elle", "For a person, use à + elle.", ["Je lui pense souvent", "J'en pense souvent"]]],
  xf: [["Replace the words in bold with y or en: de l'eau.", "Je bois de l'eau.", "J'en bois."], ["Answer in the negative with y.", "Tu vas au cinéma ce soir ?", "Non, je n'y vais pas.|Non, je n'y vais pas ce soir."]],
  chat: [["Il reste des croissants ?", "Oui, il en reste deux.", ["Oui, il les reste deux.", "Oui, il y reste deux."], "Quantity: en + number."], ["Tu penses encore à ton entretien d'embauche ?", "Oui, j'y pense tout le temps.", ["Oui, j'en pense tout le temps.", "Oui, je lui pense tout le temps."], "Penser à + thing → y."]]
});

L({ id: "b1-relatifs", lvl: "B1", tr: "phrase", cat: "relatifs", t: "Qui, que, où, dont", en: "Simple relative pronouns",
  rule: { h: "Choose the relative pronoun by the role it plays in the second clause.",
    pts: ["<b>Qui</b> = subject: <i>la femme <b>qui</b> parle est ma collègue</i>.", "<b>Que (qu')</b> = direct object: <i>le livre <b>que</b> je lis est passionnant</i>.", "<b>Où</b> = place or time: <i>la ville <b>où</b> je suis née, le jour <b>où</b> nous nous sommes rencontrés</i>.", "<b>Dont</b> replaces <b>de</b> + noun: <i>le collègue <b>dont</b> je t'ai parlé</i> (parler de), <i>la robe <b>dont</b> j'ai envie</i> (avoir envie de)."],
    ex: [["C'est Alex qui a choisi le restaurant.", "It was Alex who chose the restaurant."], ["Le film que nous avons vu était drôle.", "The film we saw was funny."], ["C'est le quartier où j'ai grandi.", "It's the area where I grew up."], ["Voici le livre dont tout le monde parle.", "Here is the book everybody is talking about."]],
    warn: "English often drops the relative pronoun (<i>the film we saw</i>). French never does: <i>le film <b>que</b> nous avons vu</i>.",
    vn: "Giống <b>«mà»</b> hoặc <b>«nơi mà»</b> trong tiếng Việt, nhưng tiếng Pháp phải chọn theo chức năng: <b>qui</b> (chủ ngữ), <b>que</b> (tân ngữ), <b>où</b> (nơi chốn, thời gian), <b>dont</b> (thay cho de + danh từ)." },
  cards: [["qui", "who, which (subject)", "J'ai une amie qui parle cinq langues.", "I have a friend who speaks five languages."], ["que", "that, whom (object)", "La chanson que tu chantes est belle.", "The song you are singing is beautiful."], ["où", "where, when", "Le jour où je suis arrivée, il neigeait.", "The day I arrived, it was snowing."], ["dont", "of which, whose, about which", "C'est un projet dont je suis fière.", "It's a project I'm proud of."], ["avoir envie de", "to feel like, to want", "Le voyage dont j'ai envie coûte cher.", "The trip I want is expensive."], ["être fier de", "to be proud of", "C'est le résultat dont elle est fière.", "It's the result she is proud of."], ["ce qui", "what (subject)", "Ce qui me plaît, c'est la lumière.", "What I like is the light."], ["ce que", "what (object)", "Ce que je préfère, c'est le marché.", "What I prefer is the market."]],
  sent: [["La collègue qui m'a aidée s'appelle Sophie.", "The colleague who helped me is called Sophie."], ["Le cours que je suis le mardi est très utile.", "The class I take on Tuesdays is very useful."], ["C'est le café où nous nous sommes rencontrés.", "It's the café where we met."], ["L'application dont je t'ai parlé est gratuite.", "The app I told you about is free."], ["Ce que j'aime à Paris, ce sont les petites librairies.", "What I like in Paris are the little bookshops."], ["Je cherche un appartement qui a un balcon.", "I'm looking for a flat that has a balcony."], ["La ville où elle est née s'appelle Đà Lạt.", "The town where she was born is called Đà Lạt."], ["C'est un souvenir dont je me souviendrai toujours.", "It's a memory I will always remember."], ["Le cadeau qu'il m'a offert est magnifique.", "The present he gave me is beautiful."], ["Ce qui m'inquiète, c'est le prix des loyers.", "What worries me is the price of rents."]],
  nat: [["Le livre que je lis est long.", "Le livre qui je lis est long.", "Je is the subject; the book is the object of lis → que."], ["La femme qui habite en face est médecin.", "La femme que habite en face est médecin.", "The woman is the subject of habite → qui."], ["Le film dont tu parles est sorti hier.", "Le film que tu parles est sorti hier.", "Parler de → dont."], ["La maison où j'ai grandi est à Cần Thơ.", "La maison que j'ai grandi est à Cần Thơ.", "A place → où."]],
  mcq: [["C'est la professeure ___ m'a appris le subjonctif.", "qui", ["que", "dont", "où"], "She is the subject of a appris."], ["Voici le restaurant ___ nous avons fêté nos fiançailles.", "où", ["que", "dont", "qui"], "A place → où."], ["C'est un sujet ___ on parle beaucoup en ce moment.", "dont", ["que", "où", "qui"], "Parler de → dont."], ["La robe ___ elle porte vient de Hội An.", "qu'", ["qui", "dont", "où"], "Elle is the subject; la robe is the object → qu'."]],
  gap: [["J'ai un voisin ___ joue du piano tous les soirs.", "qui", "", "I have a neighbour who plays the piano every evening.", ["que", "dont", "où"]], ["Le plat ___ je préfère, c'est le phở.", "que", "", "The dish I prefer is phở.", ["qui", "dont", "où"]], ["L'hôtel ___ nous avons dormi était près de la mer.", "où", "", "The hotel where we slept was near the sea.", ["que", "dont", "qui"]], ["C'est le document ___ j'ai besoin.", "dont", "", "It's the document I need.", ["que", "où", "qui"]], ["___ me fait peur, c'est l'examen oral.", "Ce qui", "", "What scares me is the oral exam.", ["Ce que", "Ce dont", "Qui"]], ["___ je voudrais, c'est un peu de calme.", "Ce que", "", "What I would like is a bit of quiet.", ["Ce qui", "Ce dont", "Que"]]],
  fix: [["C'est le film que tout le monde parle.", "que", "dont", "Parler de → dont.", ["qui", "où"]], ["Le jour que je suis arrivée, il pleuvait.", "que", "où", "With a time expression (le jour, l'année), French uses où.", ["dont", "qui"]], ["La personne que m'a appelée est ma tante.", "que", "qui", "The person is the subject of a appelée → qui.", ["dont", "où"]]],
  xf: [["Join the sentences with dont.", "J'ai rencontré un collègue. Je t'ai parlé de ce collègue.", "J'ai rencontré le collègue dont je t'ai parlé.|J'ai rencontré un collègue dont je t'ai parlé."], ["Join the sentences with où.", "Voici le parc. Nous nous promenons dans ce parc le dimanche.", "Voici le parc où nous nous promenons le dimanche."]],
  chat: [["Tu as aimé le restaurant ?", "Oui, c'est le meilleur restaurant où je sois allée cette année.", ["Oui, c'est le meilleur restaurant que je suis allée.", "Oui, c'est le meilleur restaurant dont je suis allée."], "A place → où. (After a superlative, the subjunctive sois is elegant.)"], ["De quoi tu as besoin pour ton dossier ?", "Ce dont j'ai besoin, c'est d'une lettre de recommandation.", ["Ce que j'ai besoin, c'est une lettre.", "Ce qui j'ai besoin, c'est une lettre."], "Avoir besoin de → ce dont."]]
});

L({ id: "b1-negation", lvl: "B1", tr: "phrase", cat: "negation", t: "Les négations", en: "ne… jamais, plus, rien, personne, aucun, que",
  rule: { h: "Ne goes before the verb; the second word tells you what kind of negation it is.",
    pts: ["<i>ne… pas</i> (not), <i>ne… jamais</i> (never), <i>ne… plus</i> (no longer), <i>ne… rien</i> (nothing), <i>ne… personne</i> (nobody), <i>ne… aucun(e)</i> (no, not any), <i>ne… ni… ni</i> (neither… nor).",
      "<i>Ne… que</i> is not a negation: it means <b>only</b>: <i>je n'ai que dix euros</i>.",
      "In compound tenses, <i>pas, jamais, plus, rien</i> go before the participle, but <i>personne</i> and <i>aucun</i> go after: <i>je n'ai rien vu</i> / <i>je n'ai vu personne</i>.",
      "Rien and personne can be subjects: <i>personne n'est venu, rien ne marche</i>.",
      "In spoken French, <i>ne</i> often disappears (<i>je sais pas</i>). Always write it in the exam."],
    ex: [["Je ne bois jamais de café le soir.", "I never drink coffee in the evening."], ["Elle n'habite plus à Saïgon.", "She no longer lives in Saigon."], ["Je n'ai vu personne.", "I didn't see anyone."], ["Il ne reste que deux places.", "There are only two seats left."]],
    warn: "After a negation, <i>un, une, du, de la, des</i> become <b>de</b>: <i>j'ai des frères → je n'ai pas de frères</i>. Exception: with être, <i>ce n'est pas un problème</i>.",
    vn: "Tiếng Việt chỉ cần một từ (<b>không, chưa, chẳng</b>). Tiếng Pháp cần <b>hai phần</b>: ne… pas, ne… jamais (không bao giờ), ne… plus (không còn), ne… rien (không gì cả), ne… personne (không ai)." },
  cards: [["ne… jamais", "never", "Il ne prend jamais l'avion.", "He never takes the plane."], ["ne… plus", "no longer, not any more", "Je ne fume plus.", "I don't smoke any more."], ["ne… rien", "nothing", "Je n'ai rien compris.", "I didn't understand anything."], ["ne… personne", "nobody", "Il n'y a personne à la maison.", "There's nobody at home."], ["ne… aucun", "no, not a single", "Je n'ai aucune idée.", "I have no idea."], ["ne… que", "only", "Je n'ai qu'une semaine de vacances.", "I only have one week of holiday."], ["ne… ni… ni", "neither… nor", "Elle ne mange ni viande ni poisson.", "She eats neither meat nor fish."], ["pas encore", "not yet", "Je n'ai pas encore fini.", "I haven't finished yet."]],
  sent: [["Je ne suis jamais allée en Corse.", "I've never been to Corsica."], ["Il n'y a plus de lait dans le frigo.", "There's no more milk in the fridge."], ["Personne ne m'a prévenue du changement.", "Nobody told me about the change."], ["Je n'ai rien acheté au marché.", "I didn't buy anything at the market."], ["Nous n'avons aucune nouvelle de lui.", "We have no news of him."], ["Elle ne parle que vietnamien avec sa mère.", "She only speaks Vietnamese with her mother."], ["Rien ne s'est passé comme prévu.", "Nothing went as planned."], ["Je ne connais personne dans ce quartier.", "I don't know anyone in this area."], ["Il ne boit ni thé ni café.", "He drinks neither tea nor coffee."], ["Ce n'est pas un problème.", "It's not a problem."]],
  nat: [["Je n'ai pas de voiture.", "Je n'ai pas une voiture.", "After a negation, un/une/des → de."], ["Je n'ai vu personne.", "Je n'ai personne vu.", "Personne goes after the participle."], ["Je n'ai rien mangé.", "Je n'ai mangé rien.", "Rien goes before the participle."], ["Personne n'est venu.", "Personne est venu.", "In writing, ne is required: personne n'est venu."]],
  mcq: [["Tu as encore faim ? — Non, je n'ai ___ faim.", "plus", ["jamais", "rien", "personne"], "No longer → ne… plus."], ["Tu as entendu quelque chose ? — Non, je n'ai ___ entendu.", "rien", ["personne", "aucun", "plus"], "Something → nothing: rien."], ["Il y avait du monde ? — Non, il n'y avait ___.", "personne", ["rien", "jamais", "aucun"], "People → nobody: personne."], ["Elle n'a ___ ami à Paris.", "aucun", ["aucune", "personne", "rien"], "Ami is masculine → aucun."]],

L({ id: "b1-futur", lvl: "B1", tr: "futur", cat: "temps", t: "Le futur", en: "Futur proche, futur simple, and quand + futur",
  rule: { h: "Futur proche for what is planned or about to happen; futur simple for predictions, promises and more distant plans.",
    pts: ["<b>Futur proche</b>: aller + infinitive: <i>je vais appeler ma mère</i>.", "<b>Futur simple</b>: stem + <i>-ai, -as, -a, -ons, -ez, -ont</i>. Regular stem = the infinitive (minus final -e): <i>je parlerai, je prendrai</i>.", "Irregular stems to know: <i>être → ser-, avoir → aur-, aller → ir-, faire → fer-, venir → viendr-, voir → verr-, pouvoir → pourr-, vouloir → voudr-, devoir → devr-, savoir → saur-, falloir → faudr-</i>.", "After <b>quand, lorsque, dès que</b> referring to the future, French uses the future (English uses the present): <i>quand je serai à Paris, je t'appellerai</i>."],
    ex: [["Attention, tu vas tomber !", "Careful, you're going to fall!"], ["Nous nous marierons à Saïgon.", "We will get married in Saigon."], ["Quand j'aurai le DELF B2, je chercherai un nouveau poste.", "When I have the DELF B2, I'll look for a new job."], ["Il fera beau demain dans le sud.", "It will be fine tomorrow in the south."]],
    warn: "<i>Quand je <b>serai</b> à Paris</i>, not <i>quand je suis à Paris</i>, when you mean the future. After <b>si</b>, though, use the present: <i>si tu viens, je serai contente</i>.",
    vn: "Tiếng Việt dùng <b>sẽ</b> hoặc <b>sắp</b>. Gần giống: <b>sắp</b> ≈ futur proche (je vais partir), <b>sẽ</b> ≈ futur simple (je partirai). Nhưng sau <b>quand</b> tiếng Pháp vẫn dùng thì tương lai." },

  sent: [["Je vais préparer le dîner, tu as faim ?", "I'm going to make dinner, are you hungry?"], ["Nous partirons au Viêt Nam en décembre.", "We will leave for Vietnam in December."], ["Quand tu seras prête, appelle-moi.", "When you're ready, call me."], ["Il faudra réserver la salle très tôt.", "We'll have to book the venue very early."], ["Je pourrai t'aider samedi.", "I'll be able to help you on Saturday."], ["Dès qu'il aura son diplôme, il cherchera un travail.", "As soon as he has his degree, he'll look for a job."], ["Tu verras, ce sera une belle fête.", "You'll see, it will be a lovely party."], ["Mes parents viendront à Paris au printemps.", "My parents will come to Paris in the spring."], ["Le train va partir, dépêche-toi !", "The train is about to leave, hurry up!"], ["Nous saurons les résultats dans un mois.", "We'll know the results in a month."]],
  nat: [["Quand je serai à Lyon, je t'appellerai.", "Quand je suis à Lyon, je t'appellerai.", "After quand referring to the future, use the future."], ["Si tu viens, je serai contente.", "Si tu viendras, je serai contente.", "After si, never the future: use the present."], ["Elle viendra demain.", "Elle venira demain.", "Venir has the irregular stem viendr-."], ["Nous irons à la mer.", "Nous allerons à la mer.", "Aller has the irregular stem ir-."]],
  mcq: [["L'année prochaine, je ___ en master.", "serai", ["suis", "serais", "étais"], "A future fact: futur simple of être."], ["Quand tu ___ le temps, lis ce livre.", "auras", ["as", "aurais", "avais"], "Quand + future meaning → futur."], ["Regarde ces nuages : il ___ pleuvoir.", "va", ["ira", "allait", "irait"], "Something about to happen, with a visible sign: futur proche."], ["Nous ___ vous voir dès que possible.", "viendrons", ["venirons", "venons", "viendrions"], "Venir → viendr-."]],

  cards: [["il faut que", "it is necessary that, must", "Il faut que je finisse ce dossier.", "I must finish this file."], ["vouloir que", "to want someone to", "Je veux que tu m'écoutes.", "I want you to listen to me."], ["souhaiter que", "to wish that", "Je souhaite que tout se passe bien.", "I hope everything goes well."], ["être content que", "to be happy that", "Je suis contente que tu sois là.", "I'm happy you're here."], ["avoir peur que", "to be afraid that", "J'ai peur qu'il soit en retard.", "I'm afraid he'll be late."], ["c'est dommage que", "it's a pity that", "C'est dommage que tu partes déjà.", "It's a pity you're already leaving."], ["il est important que", "it is important that", "Il est important que vous arriviez à l'heure.", "It's important that you arrive on time."], ["regretter que", "to be sorry that", "Je regrette que tu ne puisses pas venir.", "I'm sorry you can't come."]],
