L({ id: "c1-modal", lvl: "C1", tr: "nuance", cat: "argumentation", t: "Modaliser et nuancer", en: "Hedging, distancing, conceding with precision",
  rule: { h: "C1 writers show how sure they are: they hedge, distance themselves from a source, and qualify claims.",
    pts: ["<b>Cautious</b>: <i>il se pourrait que, il n'est pas exclu que</i> (+ subj.), <i>vraisemblablement, a priori, dans une certaine mesure</i>.", "<b>Distance from a source</b>: conditionnel journalistique (<i>le ministre aurait démissionné</i>), <i>selon, d'après, à en croire</i>, <i>prétendument</i>.", "<b>Firm</b>: <i>force est de constater que, il ne fait aucun doute que, il est indéniable que</i> (+ ind.).", "<b>Qualify</b>: <i>en partie, dans une large mesure, du moins, plus ou moins, à bien des égards</i>.", "<b>Attenuate</b> with the conditional: <i>on pourrait objecter que, il conviendrait de, il semblerait que</i>."],
    ex: [["Force est de constater que les mesures n'ont pas suffi.", "One has to admit that the measures were not enough."], ["Il se pourrait que la situation s'améliore.", "The situation might improve."], ["Selon l'agence, le projet aurait coûté deux millions.", "According to the agency, the project reportedly cost two million."], ["Cette hypothèse est, dans une large mesure, convaincante.", "This hypothesis is, to a large extent, convincing."]],
    warn: "In the DALF synthèse, report the documents' claims with distance (<i>selon le document 1…</i>) and never give your own opinion; keep the firm markers for the essai.",
    vn: "Tiếng Việt dùng <b>có lẽ, có thể, được cho là</b>. Tiếng Pháp C1 dùng <b>thức điều kiện</b> để giữ khoảng cách: <i>le ministre aurait démissionné</i> = Bộ trưởng <b>được cho là</b> đã từ chức." },
  cards: [["force est de constater que", "one has to admit that", "Force est de constater que rien n'a changé.", "One has to admit nothing has changed."], ["il se pourrait que", "it might be that (+ subj.)", "Il se pourrait qu'il pleuve.", "It might rain."], ["il n'est pas exclu que", "it cannot be ruled out that", "Il n'est pas exclu qu'elle démissionne.", "Her resignation can't be ruled out."], ["vraisemblablement", "in all likelihood", "Il viendra vraisemblablement demain.", "He'll most likely come tomorrow."], ["à en croire", "if we are to believe", "À en croire la presse, tout va bien.", "If we believe the press, all is well."], ["dans une large mesure", "to a large extent", "C'est dans une large mesure vrai.", "It's largely true."], ["à bien des égards", "in many respects", "À bien des égards, il a raison.", "In many respects, he's right."], ["il conviendrait de", "it would be advisable to", "Il conviendrait de vérifier ces chiffres.", "These figures ought to be checked."]],
  sent: [["Force est de constater que les inégalités se creusent.", "One has to admit that inequality is widening."], ["Il n'est pas exclu que la réunion soit reportée.", "The meeting may well be postponed."], ["D'après certains experts, la croissance ralentirait l'an prochain.", "According to some experts, growth would slow next year."], ["Il ne fait aucun doute que le numérique a transformé l'école.", "There's no doubt digital technology has transformed schools."], ["Dans une certaine mesure, cette critique est fondée.", "To some extent, this criticism is justified."], ["On pourrait objecter que le coût est trop élevé.", "One could object that the cost is too high."], ["Il conviendrait de nuancer ce constat.", "This observation should be qualified."], ["À en croire les sondages, l'opinion serait divisée.", "If the polls are to be believed, opinion is divided."], ["Ce modèle est, à bien des égards, une réussite.", "This model is in many respects a success."], ["Il semblerait que la tendance s'inverse.", "It would seem the trend is reversing."]],
  nat: [["Il se pourrait qu'il ait raison.", "Il se pourrait qu'il a raison.", "Il se pourrait que + subjunctive."], ["Force est de constater que c'est un échec.", "Force est de constater que ce soit un échec.", "Force est de constater que + indicative."], ["Le suspect aurait quitté le pays.", "Le suspect aura quitté le pays selon on.", "Distance: journalistic conditional."], ["Il conviendrait de vérifier.", "Il conviendra de vérifier peut-être que.", "Attenuation: conditional."]],
  mcq: [["___ que les objectifs n'ont pas été atteints.", "Force est de constater", ["Il se pourrait", "Il n'est pas exclu", "Il semble"], "Firm statement + indicative."], ["Il n'est pas exclu que le prix ___.", "augmente", ["augmentera", "augmente-t-il", "augmentait"], "+ subjunctive."], ["Selon le journal, l'entreprise ___ 200 emplois.", "supprimerait", ["supprimera", "supprime", "supprimât"], "Unconfirmed report: conditional."], ["Cette analyse est ___ pertinente, mais incomplète.", "dans une large mesure", ["force est de", "il se pourrait", "à en croire"], "Qualifying."]],
  gap: [["Il se ___ que nous changions de stratégie.", "pourrait", "pouvoir", "We might change strategy.", ["peut que", "pourra", "pouvait"]], ["___ est de constater que la réforme a échoué.", "Force", "", "One has to admit the reform failed.", ["Il", "Fort", "Forcé"]], ["À en ___ les experts, la crise sera courte.", "croire", "", "If the experts are to be believed, the crisis will be short.", ["croyant", "crois", "cru"]], ["Il ___ de vérifier ces sources.", "conviendrait", "convenir", "These sources ought to be checked.", ["convient que", "convenait", "conviendra que"]], ["D'après la police, le voleur ___ entré par le toit.", "serait", "être", "According to the police, the thief got in through the roof.", ["sera", "est", "soit"]], ["À bien des ___, ce projet est exemplaire.", "égards", "", "In many respects, this project is exemplary.", ["regards", "points", "fois"]]],
  fix: [["Il se pourrait qu'il viendra.", "viendra", "vienne", "Il se pourrait que + subjunctive.", ["vient", "viendrait"]], ["Force est de constater que la situation soit grave.", "soit", "est", "A firm statement → indicative.", ["sera", "serait"]], ["Selon les médias, le ministre a démissionné, mais rien n'est confirmé.", "a démissionné", "aurait démissionné", "Unconfirmed → conditionnel journalistique.", ["démissionnera", "démissionnait"]]],
  xf: [["Distance yourself from the source.", "Selon la presse, le festival est annulé.", "Selon la presse, le festival serait annulé."], ["Make it firmer.", "Il semble que la mesure a échoué.", "Force est de constater que la mesure a échoué.|Il ne fait aucun doute que la mesure a échoué."]],
  chat: [["Le directeur va vraiment partir ?", "Rien n'est officiel, mais il n'est pas exclu qu'il parte en juin.", ["Il n'est pas exclu qu'il partira.", "Il est exclu qu'il part."], "Il n'est pas exclu que + subjunctive."], ["Que dit le document 2 sur le télétravail ?", "Selon l'auteur, le télétravail renforcerait l'isolement des jeunes salariés.", ["Je pense que le télétravail isole.", "Le télétravail isole, c'est sûr."], "Report a source with distance, not your opinion."]]
});

L({ id: "c1-registres", lvl: "C1", tr: "nuance", cat: "registre", t: "Familier, courant, soutenu", en: "Switching register with control",
  rule: { h: "A C1 speaker understands familiar French and chooses the register that fits the situation.",
    pts: ["<b>Familier</b>: dropped <i>ne</i>, <i>on</i> for nous, <i>ça</i>, slang (<i>bosser, bouffe, truc, mec, nana, kiffer</i>), verlan (<i>ouf = fou, relou = lourd</i>), questions by intonation.", "<b>Courant</b>: complete negation, standard vocabulary, <i>est-ce que</i>.", "<b>Soutenu</b>: inversion (<i>pourriez-vous</i>), precise verbs (<i>se rendre</i> for aller, <i>effectuer</i> for faire), nominalisation, subjunctive and literary tenses.", "Many neutral verbs have a more precise formal equivalent: <i>avoir → disposer de, posséder; dire → affirmer, souligner; voir → constater</i>.", "In the DALF, write in courant-to-soutenu; in the oral, keep a courant register with the jury and avoid slang."],
    ex: [["J'ai pas capté. → Je n'ai pas compris. → Je n'ai pas saisi.", "I didn't get it."], ["On se fait une bouffe ? → On dîne ensemble ? → Vous joindrez-vous à nous pour le dîner ?", "Shall we have dinner?"], ["C'est ouf ! → C'est incroyable ! → C'est stupéfiant.", "It's crazy / incredible / astonishing."], ["Il a dit que… → Il a souligné que…", "He said that… → He stressed that…"]],
    warn: "Using soutenu everywhere sounds pompous; using familier in an exam sounds careless. The skill is to match the situation.",
    vn: "Giống tiếng Việt có văn nói, văn viết và văn trang trọng (ví dụ: <b>ăn – dùng bữa – xơi</b>). Ở C1, người chấm đánh giá khả năng <b>chọn đúng giọng văn</b>." },
  cards: [["bosser", "to work (fam.)", "Je bosse ce week-end.", "I'm working this weekend."], ["un truc", "a thing (fam.)", "C'est quoi, ce truc ?", "What's this thing?"], ["kiffer", "to love (fam.)", "Je kiffe ce quartier.", "I love this area."], ["ouf (verlan)", "crazy (fou)", "Ce concert était ouf !", "That concert was crazy!"], ["se rendre", "to go (formal)", "Je me rendrai à Lyon lundi.", "I'll go to Lyon on Monday."], ["effectuer", "to carry out (formal)", "Effectuer un paiement.", "To make a payment."], ["disposer de", "to have (formal)", "Nous disposons de deux salles.", "We have two rooms available."], ["constater", "to observe, to note", "On constate une baisse.", "A fall is observed."]],
  sent: [["T'as vu l'heure ? Faut qu'on y aille.", "Have you seen the time? We've got to go."], ["Il faut que nous partions, il est tard.", "We must leave, it's late."], ["Nous sommes contraints de prendre congé, l'heure étant avancée.", "We are obliged to take our leave, the hour being late."], ["Ce boulot me prend la tête.", "This job is doing my head in."], ["Ce travail est particulièrement éprouvant.", "This work is particularly demanding."], ["J'ai la flemme de sortir ce soir.", "I can't be bothered to go out tonight."], ["Je me rendrai à la réunion dès que possible.", "I will go to the meeting as soon as possible."], ["Vous pouvez effectuer le paiement en ligne.", "You can make the payment online."], ["On constate une nette amélioration des résultats.", "A clear improvement in results can be seen."], ["Le rapport souligne la nécessité d'agir.", "The report stresses the need to act."]],
  nat: [["(to a jury) Je n'ai pas bien compris la question.", "(to a jury) J'ai pas capté la question.", "Oral exam: courant register at least."], ["(to a friend) On se fait un ciné ?", "(to a friend) Vous joindrez-vous à moi pour une séance de cinéma ?", "Too formal for a friend."], ["(report) On observe une hausse des prix.", "(report) Les prix ont grave augmenté.", "Report: no slang."], ["(e-mail to HR) Je me permets de vous relancer.", "(e-mail to HR) Je vous relance, hein.", "Professional register."]],
  mcq: [["Soutenu for « aller à Paris »:", "se rendre à Paris", ["filer à Paris", "monter à Paris en vitesse", "bouger sur Paris"], "Se rendre = to go (formal)."], ["Familier for « travailler »:", "bosser", ["œuvrer", "effectuer", "se consacrer"], "Bosser is familier."], ["In a report, « Le document dit que… » is better as:", "Le document souligne que…", ["Le document balance que…", "Le doc fait que…", "Le document cause que…"], "A precise reporting verb."], ["« C'est relou » means:", "c'est pénible", ["c'est génial", "c'est rouge", "c'est loin"], "Relou = lourd (verlan), annoying."]],
  gap: [["Je me ___ à votre bureau demain matin. (go, formal)", "rendrai", "se rendre", "I'll come to your office tomorrow morning.", ["rends", "irais", "bougerai"]], ["Nous ___ de trois salles de réunion. (have, formal)", "disposons", "disposer", "We have three meeting rooms.", ["avons dispo", "possédez", "disposez"]], ["J'ai pas le temps, je ___ toute la journée. (fam.)", "bosse", "bosser", "I don't have time, I'm working all day.", ["œuvre", "effectue", "travail"]], ["L'auteur ___ l'importance de l'éducation. (stresses)", "souligne", "souligner", "The author stresses the importance of education.", ["dit grave", "cause", "balance"]], ["Vous pouvez ___ votre réservation en ligne. (make, formal)", "effectuer", "", "You can make your booking online.", ["faire genre", "bosser", "kiffer"]], ["On ___ une baisse du chômage. (observe)", "constate", "constater", "A fall in unemployment is observed.", ["capte", "kiffe", "voit genre"]]],
  fix: [["(DALF essay) Les réseaux sociaux, c'est trop relou pour les ados.", "c'est trop relou pour les ados", "posent de réels problèmes aux adolescents", "An essay needs a courant-to-soutenu register.", ["c'est grave nul pour les ados", "c'est relou pour les jeunes"]], ["(e-mail to a client) Salut, je vous envoie le truc.", "Salut, je vous envoie le truc.", "Bonjour, je vous envoie le document.", "A client e-mail: no salut, no truc.", ["Coucou, je vous envoie le truc.", "Salut, voici le machin."]], ["(oral exam) Bah, j'sais pas trop, en fait.", "Bah, j'sais pas trop, en fait.", "C'est une question complexe ; permettez-moi d'y réfléchir.", "Oral exam: avoid fillers and dropped ne.", ["Euh, j'sais pas.", "Bof, aucune idée."]]],
  xf: [["Make it courant.", "J'ai pas pigé ce qu'il a dit.", "Je n'ai pas compris ce qu'il a dit."], ["Make it soutenu.", "On a fait une enquête.", "Nous avons effectué une enquête.|Nous avons mené une enquête."]],
  chat: [["(A friend, by text) Ce soir resto ?", "Carrément ! On se retrouve à 20 h ?", ["Je me joindrai volontiers à vous pour le dîner.", "Nous effectuerons ce dîner."], "A friend: familier is natural."], ["(The jury) Pouvez-vous préciser votre position ?", "Bien sûr. Je considère que cette mesure, bien qu'utile, reste insuffisante.", ["Ben, c'est pas mal, mais bof.", "Ouais, c'est ouf mais relou."], "Exam: courant to soutenu."]]
});

L({ id: "c1-lexique", lvl: "C1", tr: "nuance", cat: "lexique", t: "Le mot juste", en: "Replacing faire, dire, avoir, il y a and chose",
  rule: { h: "C1 writing replaces general words with precise ones: the examiner counts 'étendue du vocabulaire'.",
    pts: ["<b>Faire</b> → <i>effectuer (un paiement), mener (une enquête), réaliser (un projet), commettre (une erreur), prononcer (un discours)</i>.", "<b>Dire</b> → <i>affirmer, souligner, rappeler, préciser, avancer, déclarer, reconnaître</i>.", "<b>Avoir</b> → <i>posséder, disposer de, présenter (un avantage), connaître (une croissance), comporter</i>.", "<b>Il y a</b> → <i>on observe, on constate, il existe, figurer, se trouver</i>.", "<b>Chose / problème</b> → <i>élément, aspect, phénomène, enjeu, difficulté, défi, obstacle</i>."],
    ex: [["Le gouvernement a mené une vaste réforme.", "The government carried out a sweeping reform."], ["L'auteure souligne que l'école reproduit les inégalités.", "The author stresses that school reproduces inequality."], ["Cette méthode présente plusieurs avantages.", "This method has several advantages."], ["L'enjeu principal reste le financement.", "The main issue remains funding."]],
    warn: "Each precise verb has its own construction: <i>souligner que, rappeler que, mettre l'accent sur, insister sur</i>. Learn them with their preposition.",
    vn: "Giống trong tiếng Việt học thuật, thay <b>«làm», «nói», «có»</b> bằng từ chính xác hơn (<b>tiến hành, nhấn mạnh, sở hữu</b>). Trong DALF, sự đa dạng từ vựng chiếm nhiều điểm." },
  cards: [["mener", "to carry out, to lead", "Mener une enquête, une politique.", "To carry out a survey, a policy."], ["réaliser", "to carry out, to achieve", "Réaliser un projet ambitieux.", "To carry out an ambitious project."], ["souligner", "to stress", "Il souligne l'urgence de la situation.", "He stresses the urgency of the situation."], ["avancer", "to put forward", "L'auteur avance plusieurs arguments.", "The author puts forward several arguments."], ["présenter", "to have, to show (advantages)", "Ce choix présente des risques.", "This choice involves risks."], ["connaître", "to experience (growth)", "Le secteur connaît une forte croissance.", "The sector is experiencing strong growth."], ["un enjeu", "an issue, what is at stake", "L'enjeu est considérable.", "The stakes are considerable."], ["un défi", "a challenge", "Relever un défi.", "To take up a challenge."]],
  sent: [["Les chercheurs ont mené une étude sur deux mille élèves.", "The researchers carried out a study of two thousand pupils."], ["La ville a réalisé d'importants travaux de rénovation.", "The city has carried out major renovation work."], ["Le rapport rappelle que l'accès à l'eau est un droit.", "The report recalls that access to water is a right."], ["Cette solution présente l'avantage d'être peu coûteuse.", "This solution has the advantage of being inexpensive."], ["Le tourisme connaît une reprise depuis deux ans.", "Tourism has been recovering for two years."], ["On observe une hausse du nombre d'étudiants étrangers.", "An increase in the number of foreign students is observed."], ["L'auteure reconnaît que son étude comporte des limites.", "The author acknowledges that her study has limitations."], ["La formation continue constitue un enjeu majeur pour les entreprises.", "Continuing education is a major issue for companies."], ["Le principal obstacle demeure le manque de financement.", "The main obstacle remains the lack of funding."], ["Il a commis une erreur de jugement.", "He made an error of judgement."]],
  nat: [["Mener une enquête", "Faire une enquête… et faire un rapport sur la chose", "Precise verbs and nouns."], ["Il a commis une erreur.", "Il a réalisé une erreur.", "Commettre une erreur."], ["Le secteur connaît une croissance rapide.", "Le secteur a une croissance rapide qui est là.", "Connaître une croissance."], ["L'auteur souligne que…", "L'auteur souligne sur le fait que…", "Souligner que (no sur)."]],
  mcq: [["___ une politique de réduction des déchets", "mener", ["faire faire", "commettre", "prononcer"], "Mener une politique."], ["___ un discours", "prononcer", ["effectuer", "mener", "commettre"], "Prononcer un discours."], ["Le marché ___ une baisse depuis 2024.", "connaît", ["a eu", "commet", "souligne"], "Connaître une baisse."], ["L'auteur ___ trois arguments.", "avance", ["fait", "commet", "connaît"], "Avancer des arguments."]],
  gap: [["Il faut ___ un paiement avant le 10. (make, formal)", "effectuer", "", "A payment must be made before the 10th.", ["commettre", "mener", "prononcer"]], ["La directrice a ___ un discours émouvant.", "prononcé", "prononcer", "The director gave a moving speech.", ["effectué", "mené", "commis"]], ["Le texte ___ que la mesure est temporaire. (specifies)", "précise", "préciser", "The text specifies that the measure is temporary.", ["commet", "connaît", "mène"]], ["Cette méthode ___ plusieurs inconvénients.", "présente|comporte", "", "This method has several drawbacks.", ["commet", "prononce", "effectue"]], ["L'___ principal de ce débat est l'égalité.", "enjeu", "", "The main issue in this debate is equality.", ["en jeu", "jeu", "enjoué"]], ["Il a ___ une grave erreur.", "commis", "commettre", "He made a serious mistake.", ["réalisé", "mené", "effectué"]]],
  fix: [["Le gouvernement a fait une enquête sur le logement.", "a fait", "a mené", "Mener une enquête.", ["a commis", "a prononcé"]], ["Il a réalisé une erreur grave.", "a réalisé", "a commis", "Commettre une erreur.", ["a mené", "a effectué"]], ["L'auteure dit que l'école doit changer.", "dit", "affirme", "A precise reporting verb.", ["fait", "cause"]]],
  xf: [["Replace faire with a precise verb.", "Nous avons fait un projet de formation en ligne.", "Nous avons réalisé un projet de formation en ligne.|Nous avons mené un projet de formation en ligne.|Nous avons conçu un projet de formation en ligne."], ["Replace il y a.", "Il y a une augmentation du chômage.", "On observe une augmentation du chômage.|On constate une augmentation du chômage."]],
  chat: [["Décris ton dernier projet en une phrase, version CV.", "J'ai conçu et piloté un parcours de formation en ligne pour trois cents collaborateurs.", ["J'ai fait un truc en ligne pour des gens.", "J'ai eu un projet de formation."], "Precise verbs: concevoir, piloter."], ["Que dit le document 1 ?", "Il souligne que la sobriété numérique devient un enjeu pour les entreprises.", ["Il dit des choses sur le numérique.", "Il fait que le numérique est un truc."], "Precise reporting verb and noun."]]
});

L({ id: "c1-synthese", lvl: "C1", tr: "methode", cat: "argumentation", t: "La synthèse de documents", en: "DALF C1 written paper, part 1",
  rule: { h: "A synthèse brings together the ideas of several documents, organised by theme, in your own words, with no opinion.",
    pts: ["Length: about <b>220–240 words</b>. Title required. No personal opinion, no information from outside the documents, no quotations.", "Read actively: find the shared theme, each document's main idea, where they agree and where they differ.", "Build a <b>thematic plan</b> (2 or 3 parts), not one paragraph per document: each part crosses the documents.", "Introduction: theme + problem in one or two sentences (and, if you like, the nature of the documents). Conclusion: a short summary, no opinion.", "Reformulate: nominalise, use synonyms, report with distance: <i>selon le document 1, les deux auteurs s'accordent à dire que, à l'inverse, le second texte nuance…</i>"],
    ex: [["Les deux documents s'accordent sur l'essor du télétravail.", "Both documents agree on the rise of remote work."], ["Si le premier texte en souligne les avantages, le second insiste sur ses risques.", "While the first text stresses its advantages, the second insists on its risks."], ["Les auteurs divergent quant aux solutions à envisager.", "The authors differ as to the solutions to consider."], ["En somme, le télétravail apparaît comme une avancée ambivalente.", "In short, remote work appears to be an ambivalent advance."]],
    warn: "The most common mistakes: giving your opinion, copying sentences from the texts, and summarising document 1 then document 2 without linking them.",
    vn: "Synthèse không phải là tóm tắt từng bài. Hãy <b>nhóm ý theo chủ đề</b>, so sánh các tài liệu với nhau, viết <b>bằng lời của mình</b> và <b>không nêu ý kiến cá nhân</b> (ý kiến để dành cho phần essai)." },

      "Pour la mairie, ces jardins présentent aussi un intérêt écologique : ils favorisent la biodiversité et rafraîchissent la ville pendant les vagues de chaleur. C'est pourquoi elle aide les associations à trouver des terrains.",
      "Tout n'est pas simple pour autant. Les places sont rares et les listes d'attente longues : dans certains quartiers, il faut attendre plus d'un an. Et il faut respecter des règles : venir régulièrement, participer aux tâches collectives et ne pas utiliser de produits chimiques.",
      "« C'est un engagement, reconnaît Sophie, mais je ne pourrais plus m'en passer. Le samedi matin au jardin, c'est mon moment de calme dans la semaine. »"],
    gloss: [["un potager", "a vegetable garden"], ["un carré de salades", "a patch of lettuces"], ["une vague de chaleur", "a heatwave"], ["une liste d'attente", "a waiting list"], ["s'en passer", "to do without it"]],
    q: [["What are shared gardens often built on?", "Abandoned land", ["Private balconies", "Rooftops of schools", "Public parks"], "« souvent installés sur des terrains abandonnés »", 1],
      ["Why did Sophie join the garden at first?", "To grow her own vegetables", ["To meet people", "To organise parties", "To work for the city"], "« Au début, je venais surtout pour les légumes. »", 1],
      ["What did she discover was most important?", "Meeting people", ["Saving money", "Eating organic food", "Learning gardening techniques"], "« le plus important, c'était les rencontres »", 1],
      ["According to the city, what is one ecological benefit?", "Gardens cool the city during heatwaves.", ["Gardens reduce traffic.", "Gardens produce energy.", "Gardens replace parks."], "« rafraîchissent la ville pendant les vagues de chaleur »", 1.5],
      ["What is one difficulty mentioned?", "There are long waiting lists.", ["The gardens are too expensive.", "The gardens close in winter.", "Children are not allowed."], "« les listes d'attente longues »", 1.5],
      ["Which rule must gardeners follow?", "Not use chemical products", ["Come every day", "Pay a monthly fee", "Grow only flowers"], "« ne pas utiliser de produits chimiques »", 1],
      ["How does Sophie feel about the garden today?", "She couldn't do without it.", ["She finds it too demanding.", "She wants to leave.", "She prefers her balcony."], "« je ne pourrais plus m'en passer »", 1]] },

  { id: "r-b1-lettre", lvl: "B1", kind: "letter", t: "Une invitation en Bretagne", lessons: ["b1-futur", "b1-ecrire", "b1-cond"],
    paras: ["Chère Lan Anh,", "Alex m'a dit que vous seriez libres pendant les vacances de Pâques. Nous serions très heureux de vous accueillir en Bretagne ! La maison n'est pas grande, mais il y a une chambre pour vous avec une vue sur la mer.", "Si le temps le permet, nous irons nous promener sur le sentier des douaniers et nous mangerons des crêpes à Saint-Malo. Et s'il pleut — c'est la Bretagne ! — je te montrerai comment on prépare le far breton.", "Pourrais-tu me dire si tu as des allergies ou des plats que tu n'aimes pas ? Je voudrais préparer un dîner de bienvenue qui te plaise.", "Nous avons hâte de te revoir. Je t'embrasse,", "Catherine"],
    q: [["Who is Catherine probably?", "A member of Alex's family", ["Lan Anh's colleague", "A hotel owner", "Lan Anh's teacher"], "She knows Alex and invites them to the family house.", 1],
      ["When are they invited?", "During the Easter holidays", ["At Christmas", "In the summer", "For Tết"], "« pendant les vacances de Pâques »", 1],
      ["What will they do if it rains?", "Make a far breton together", ["Go to Saint-Malo", "Walk along the coast", "Go to the cinema"], "« s'il pleut… je te montrerai comment on prépare le far breton »", 1],
      ["What does Catherine ask Lan Anh?", "Whether she has allergies or dislikes", ["What time she arrives", "Whether she can cook", "Whether she likes the sea"], "« si tu as des allergies ou des plats que tu n'aimes pas »", 1],
      ["Which register does Catherine use?", "Friendly, with tu", ["Formal, with vous", "Very familiar slang", "Administrative"], "Chère Lan Anh… Je t'embrasse.", 1]] },

  { id: "r-b1-forum", lvl: "B1", kind: "forum post", t: "Vivre à l'étranger : vos expériences", lessons: ["b1-pc-imp", "b1-opinion"],
    paras: ["Message de Minh, 29 ans : Je suis arrivé à Lyon il y a trois ans pour faire un master. Au début, tout me semblait difficile : je ne comprenais pas les gens quand ils parlaient vite, et je n'osais pas téléphoner à l'administration.", "Un jour, ma voisine m'a invité à un repas de quartier. Je ne connaissais personne, mais tout le monde m'a posé des questions sur le Viêt Nam. Ce soir-là, j'ai compris que mon accent n'était pas un problème : c'était même un point de départ pour discuter.", "Aujourd'hui, je travaille dans une entreprise d'informatique et je me sens chez moi. À mon avis, le plus important quand on vit à l'étranger, c'est d'accepter de faire des erreurs. Je pense aussi qu'il faut garder un lien avec sa culture : je cuisine encore le dimanche les plats de ma mère.", "Et vous, qu'est-ce qui vous a aidés à vous intégrer ?"],
    q: [["Why did Minh come to Lyon?", "To study for a master's degree", ["To work in IT", "To join his family", "For a holiday"], "« pour faire un master »", 1],
      ["What was difficult at first?", "Understanding people who spoke fast", ["Finding a flat", "Cooking French food", "Making friends at university"], "« je ne comprenais pas les gens quand ils parlaient vite »", 1],
      ["What changed his view of his accent?", "A neighbourhood meal", ["A French course", "A job interview", "A phone call"], "At the repas de quartier people asked about Vietnam.", 1],
      ["What is his main advice?", "Accept making mistakes", ["Lose your accent", "Avoid your own culture", "Speak only French at home"], "« le plus important… c'est d'accepter de faire des erreurs »", 1],
      ["How does he keep a link with his culture?", "He cooks his mother's dishes on Sundays.", ["He calls Vietnam every day.", "He teaches Vietnamese.", "He goes back every month."], "« je cuisine encore le dimanche les plats de ma mère »", 1]] },

  { id: "r-b2-quatrejours", lvl: "B2", exam: true, mins: 30, kind: "CE · press article", t: "La semaine de quatre jours : révolution ou illusion ?", lessons: ["b2-argu", "b2-concession"],
    paras: ["Travailler quatre jours au lieu de cinq, sans perte de salaire : l'idée, longtemps jugée utopique, séduit désormais de nombreuses entreprises en Europe. Au Royaume-Uni, une expérimentation menée auprès d'une soixantaine d'entreprises a montré que la grande majorité d'entre elles avaient choisi de poursuivre l'expérience au terme des six mois d'essai.",
      "Les partisans de la semaine de quatre jours avancent plusieurs arguments. D'abord, les salariés seraient moins fatigués, donc plus concentrés et plus efficaces. Ensuite, un jour de repos supplémentaire permettrait de mieux concilier vie professionnelle et vie familiale. Enfin, les entreprises qui l'adoptent deviendraient plus attractives, ce qui n'est pas négligeable dans les secteurs où il est difficile de recruter.",
      "Pourtant, le modèle ne convient pas à tous. Dans les hôpitaux, les commerces ou les écoles, où la présence est indispensable, réduire le temps de travail suppose d'embaucher davantage, et donc d'augmenter les coûts. Par ailleurs, certains salariés constatent que les journées de travail, plus longues ou plus denses, deviennent épuisantes : on fait en quatre jours ce qu'on faisait en cinq.",
      "Les syndicats eux-mêmes sont partagés. Certains y voient une avancée sociale comparable à l'instauration des congés payés ; d'autres craignent que la mesure ne serve de prétexte pour intensifier le travail. Tout dépend, selon eux, de la façon dont elle est mise en place : avec ou sans réduction du temps de travail réel, avec ou sans concertation.",
      "En France, quelques entreprises et administrations testent déjà différentes formules, parfois en concentrant les 35 heures sur quatre jours. Les premiers retours sont encourageants, mais encore trop limités pour en tirer des conclusions générales. Une chose est sûre : la question du temps de travail, que l'on croyait réglée depuis les années 2000, revient au cœur du débat public."],
    gloss: [["concilier", "to reconcile, to balance"], ["les syndicats", "trade unions"], ["l'instauration", "the introduction"], ["la concertation", "consultation"]],
    q: [["What did the British experiment show?", "Most companies decided to continue.", ["Most companies stopped after a month.", "Salaries were reduced.", "Employees refused the idea."], "« la grande majorité d'entre elles avaient choisi de poursuivre »", 2],
      ["According to supporters, why would employees be more efficient?", "Because they would be less tired.", ["Because they would earn more.", "Because they would work longer days.", "Because they would have new tools."], "« moins fatigués, donc plus concentrés et plus efficaces »", 2],
      ["Why is the model hard to apply in hospitals?", "It would require hiring more staff.", ["Patients don't want it.", "Doctors already work four days.", "It is illegal."], "« réduire le temps de travail suppose d'embaucher davantage »", 2],
      ["What risk do some employees mention?", "Longer, more exhausting working days", ["Losing their jobs", "Having fewer holidays", "Working at weekends"], "« on fait en quatre jours ce qu'on faisait en cinq »", 2],
      ["What is the unions' position?", "They are divided.", ["They are all in favour.", "They are all against.", "They have no opinion."], "« Les syndicats eux-mêmes sont partagés. »", 2],
      ["What do some unions fear?", "That the measure will be used to intensify work", ["That salaries will rise too much", "That companies will close", "That holidays will be cancelled"], "« craignent que la mesure ne serve de prétexte pour intensifier le travail »", 2],
      ["How are the first results in France described?", "Encouraging but too limited to generalise", ["Disappointing", "Definitive", "Unknown"], "« encourageants, mais encore trop limités »", 2],
      ["What is the author's overall attitude?", "Balanced: presenting arguments on both sides", ["Strongly in favour", "Strongly against", "Indifferent"], "The article sets out advantages, limits and divided opinions.", 1]] },

  { id: "r-b2-applis", lvl: "B2", exam: true, mins: 30, kind: "CE · opinion article", t: "Apprendre une langue avec une application : miracle ou mirage ?", lessons: ["b2-doute", "b2-lexique"],
    paras: ["Des millions de personnes ouvrent chaque jour une application pour apprendre une langue. Cinq minutes dans le métro, une série de mots à répéter, une petite fête virtuelle à la fin de la leçon : la promesse est séduisante. Mais peut-on vraiment devenir bilingue en jouant sur son téléphone ?",
      "Pour les chercheurs en didactique, la réponse est nuancée. Ces applications présentent un atout indéniable : la régularité. Il vaut mieux étudier dix minutes par jour qu'une fois par mois pendant trois heures, car la mémoire a besoin de répétitions espacées dans le temps. Les notifications, les séries de jours consécutifs et les récompenses entretiennent la motivation, du moins au début.",
      "En revanche, la plupart de ces outils travaillent surtout la reconnaissance : on choisit la bonne réponse parmi plusieurs propositions. Or, comprendre un mot quand on le voit ne signifie pas qu'on saura l'utiliser dans une conversation. Pour parler, il faut parler — et une application, si intelligente soit-elle, remplace difficilement un échange réel, avec ses hésitations, ses malentendus et ses rires.",
      "Il semble donc que l'application soit un complément plutôt qu'une méthode à part entière. Les enseignants qui l'utilisent en classe la réservent souvent au vocabulaire et à la révision, et consacrent le temps du cours à l'interaction. Les apprenants les plus efficaces, eux, combinent plusieurs sources : une application, des séries en version originale, un partenaire de conversation.",
      "Reste une question que les concepteurs commencent à se poser : comment évaluer réellement les progrès ? Accumuler des points ne dit rien du niveau atteint. Certaines plateformes proposent désormais des tests alignés sur le Cadre européen commun de référence, un premier pas vers plus de transparence."],
    gloss: [["un atout", "an asset"], ["entretenir", "to keep up, to sustain"], ["à part entière", "in its own right"], ["un concepteur", "a designer"]],
    q: [["What is the main advantage of apps, according to researchers?", "They encourage regular practice.", ["They teach grammar in depth.", "They replace teachers.", "They are free."], "« un atout indéniable : la régularité »", 2],
      ["Why is regularity important?", "Memory needs spaced repetition.", ["Teachers require it.", "Apps are short.", "Exams are frequent."], "« la mémoire a besoin de répétitions espacées »", 2],
      ["What do most apps mainly train?", "Recognition", ["Free conversation", "Writing essays", "Pronunciation in groups"], "« travaillent surtout la reconnaissance »", 2],
      ["What can an app hardly replace?", "A real exchange with people", ["A dictionary", "A grammar book", "A notebook"], "« remplace difficilement un échange réel »", 2],
      ["How do teachers use apps in class?", "For vocabulary and revision", ["For the whole lesson", "Only for tests", "Not at all"], "« la réservent souvent au vocabulaire et à la révision »", 2],
      ["What do the most effective learners do?", "Combine several sources", ["Use only one app", "Avoid apps completely", "Study once a month"], "« combinent plusieurs sources »", 2],
      ["What is the limit of points and rewards?", "They say nothing about the level reached.", ["They are too expensive.", "They demotivate learners.", "They are not fun."], "« Accumuler des points ne dit rien du niveau atteint. »", 2],
      ["The author's conclusion is that apps are…", "a complement, not a complete method", ["useless", "the best method", "dangerous"], "« un complément plutôt qu'une méthode à part entière »", 1]] },

  { id: "r-b2-musees", lvl: "B2", kind: "opinion piece", t: "Faut-il rendre les musées gratuits ?", lessons: ["b2-argu", "b2-concession", "b2-but"],
    paras: ["Chaque premier dimanche du mois, les files d'attente s'allongent devant de nombreux musées nationaux : l'entrée y est gratuite. Faut-il aller plus loin et supprimer complètement le prix du billet ?", "Les défenseurs de la gratuité y voient un moyen de démocratiser la culture. Pour qu'un jeune ou une famille modeste franchisse la porte d'un musée, il faut d'abord lever l'obstacle financier. Certes, de nombreux tarifs réduits existent déjà ; toutefois, ils restent mal connus.", "Leurs adversaires rappellent que le prix n'est pas le seul frein. Bien que l'entrée soit gratuite le dimanche, ce sont souvent les mêmes publics, déjà habitués, qui en profitent. Selon eux, mieux vaut investir dans la médiation : des visites adaptées, des ateliers, des horaires élargis.", "En somme, la gratuité n'est sans doute pas une fin en soi ; elle ne prend tout son sens que si elle s'accompagne d'une véritable politique d'accueil."],
    q: [["When are many national museums free?", "On the first Sunday of the month", ["Every Monday", "In August", "On public holidays"], "« Chaque premier dimanche du mois »", 1],
      ["Supporters of free entry want to…", "make culture accessible to all", ["raise museum budgets", "reduce queues", "close small museums"], "« démocratiser la culture »", 1],
      ["What do opponents say?", "Price is not the only obstacle.", ["Museums are too small.", "Tickets are too cheap.", "Families don't like museums."], "« le prix n'est pas le seul frein »", 1],
      ["What do opponents prefer to invest in?", "Mediation: tours, workshops, longer hours", ["Bigger buildings", "Advertising", "Higher salaries"], "« mieux vaut investir dans la médiation »", 1],
      ["The conclusion says free entry…", "only makes sense with a real welcome policy", ["should be abolished", "is enough on its own", "is too expensive"], "« ne prend tout son sens que si… »", 1]] },

  { id: "r-c1-attention", lvl: "C1", exam: true, mins: 50, kind: "CE · text of ideas", t: "L'attention, ressource rare",
    lessons: ["c1-modal", "c1-nominal", "c1-concession"],
    paras: ["Il fut un temps où l'information était rare et l'attention abondante. On attendait le journal du matin, on relisait les lettres, on s'ennuyait parfois des après-midi entières. Ce rapport s'est aujourd'hui inversé : l'information surabonde, et c'est notre capacité à nous concentrer qui est devenue l'objet de toutes les convoitises. Plateformes, applications et médias se livrent une concurrence acharnée pour capter quelques secondes de notre regard, que les annonceurs paieront au prix fort.",
      "Les économistes ont un nom pour ce phénomène : l'économie de l'attention. Son principe est simple. Lorsqu'un service est gratuit, c'est l'utilisateur, ou plus exactement le temps qu'il y consacre, qui constitue le produit. Dès lors, tout est pensé pour prolonger ce temps : défilement infini, lecture automatique de la vidéo suivante, notifications savamment dosées. Rien de tout cela n'est le fruit du hasard ; ce sont des choix de conception, testés et optimisés.",
      "Faut-il pour autant céder au catastrophisme et annoncer, comme le font certains essais à succès, la fin de la lecture profonde ou l'avènement d'une génération incapable de se concentrer ? Les données scientifiques invitent à la prudence. Si plusieurs études établissent un lien entre usage intensif des écrans et difficultés d'attention, il est souvent malaisé de distinguer la cause de la conséquence : est-ce l'écran qui disperse, ou les esprits déjà dispersés qui se tournent vers l'écran ? Par ailleurs, la capacité d'attention n'est pas une quantité fixe que l'on posséderait une fois pour toutes ; elle dépend de la motivation, du contexte, de la fatigue, et elle se cultive.",
      "C'est précisément là que se situe l'enjeu. Si l'attention se cultive, elle peut aussi se perdre faute d'exercice. Or, l'école, l'entreprise et la famille ont longtemps tenu pour acquise une compétence qu'il faut désormais protéger, voire enseigner. Certains établissements expérimentent des plages de travail sans téléphone ; des entreprises limitent l'envoi de courriels après dix-neuf heures ; des parents réapprennent l'ennui à leurs enfants. Ces initiatives, encore dispersées, témoignent d'une prise de conscience.",
      "Reste que la responsabilité ne saurait incomber aux seuls individus. Demander à chacun de résister seul à des dispositifs conçus par des équipes d'ingénieurs pour capter son attention relève, au mieux, de la naïveté. Plusieurs juristes plaident ainsi pour un encadrement des pratiques de conception les plus manipulatrices, comme on a encadré en son temps la publicité destinée aux enfants. D'autres jugent qu'une telle régulation, si légitime soit-elle, se heurterait à la difficulté de définir ce qui relève de la manipulation et ce qui relève du simple design.",
      "Entre l'alarmisme et l'insouciance, une voie se dessine : considérer l'attention non plus comme une ressource individuelle à exploiter, mais comme un bien commun à préserver. Ce changement de regard, modeste en apparence, pourrait bien constituer l'un des grands défis éducatifs et politiques des années à venir."],
    gloss: [["la convoitise", "covetousness, being coveted"], ["acharné", "fierce"], ["l'avènement", "the advent"], ["malaisé", "difficult"], ["incomber à", "to fall to (a responsibility)"], ["se heurter à", "to come up against"]],
    q: [["According to the first paragraph, what has been reversed?", "The relationship between scarce information and abundant attention", ["The role of newspapers and television", "The price of advertising", "The way letters are written"], "Information was rare and attention abundant; now the opposite.", 2],
      ["In the attention economy, what is 'the product' of a free service?", "The time the user spends on it", ["The software itself", "The advertiser", "The data centre"], "« c'est l'utilisateur, ou plus exactement le temps qu'il y consacre, qui constitue le produit »", 2],
      ["What does the author say about infinite scrolling and autoplay?", "They are deliberate, tested design choices.", ["They are accidental features.", "They are illegal in Europe.", "They improve concentration."], "« Rien de tout cela n'est le fruit du hasard »", 2],
      ["What is the author's attitude to 'catastrophist' essays?", "He calls for caution in interpreting the data.", ["He fully agrees with them.", "He ignores them.", "He says they are scientifically proven."], "« Les données scientifiques invitent à la prudence. »", 3],
      ["What difficulty do studies on screens and attention face?", "Distinguishing cause from consequence", ["Finding enough participants", "Measuring screen time", "Getting funding"], "« il est souvent malaisé de distinguer la cause de la conséquence »", 3],
      ["According to the text, attention is…", "a capacity that can be developed or lost", ["a fixed quantity", "purely genetic", "the same for everyone"], "« elle se cultive… elle peut aussi se perdre faute d'exercice »", 3],
      ["Which initiative is NOT mentioned?", "Banning smartphones for adults", ["Phone-free work periods at school", "Limiting e-mails after 7 pm", "Parents teaching children to be bored"], "Only the three others appear.", 2],
      ["Why does the author find individual resistance insufficient?", "Individuals face systems designed by teams of engineers.", ["Individuals don't want to change.", "Schools forbid it.", "It is too expensive."], "« résister seul à des dispositifs conçus par des équipes d'ingénieurs »", 3],
      ["What objection to regulation is mentioned?", "It is hard to define what counts as manipulation.", ["It would cost too much.", "Engineers would leave Europe.", "Children would be unprotected."], "« la difficulté de définir ce qui relève de la manipulation »", 3],
      ["What does the author propose in conclusion?", "To treat attention as a common good", ["To ban social networks", "To return to newspapers", "To let the market decide"], "« un bien commun à préserver »", 2]] },

  { id: "r-c1-bilinguisme", lvl: "C1", exam: true, mins: 50, kind: "CE · essay extract", t: "Grandir entre deux langues", lessons: ["c1-subj", "c1-hypothese", "c1-registres"],
    paras: ["Longtemps, le bilinguisme précoce a suscité la méfiance. Au milieu du XXe siècle encore, on conseillait volontiers aux familles immigrées de ne parler que la langue du pays d'accueil à leurs enfants, de peur que la langue d'origine ne freine leur réussite scolaire. Les enfants, pensait-on, risquaient de confondre les deux systèmes et de n'en maîtriser aucun.",
      "Les recherches menées depuis une quarantaine d'années ont largement battu en brèche cette idée reçue. Non seulement les enfants bilingues distinguent très tôt les deux langues, mais ils développeraient, selon plusieurs travaux, une plus grande souplesse cognitive : passer d'une langue à l'autre exercerait leur capacité à changer de perspective et à inhiber une réponse automatique. Il convient toutefois de rester mesuré : l'ampleur de cet « avantage bilingue » fait aujourd'hui débat parmi les chercheurs, certaines études récentes ne parvenant pas à le reproduire.",
      "Ce qui ne fait guère débat, en revanche, c'est la valeur affective et culturelle de la langue familiale. Pour un enfant qui grandit en France avec une mère vietnamienne, le vietnamien n'est pas une simple compétence à ajouter à son CV : c'est la langue des berceuses, des repas de fête, des conversations avec des grands-parents qui ne parlent pas français. Renoncer à la transmettre, c'est parfois couper un lien que rien ne remplacera.",
      "Encore faut-il que cette transmission soit possible. Car le bilinguisme ne va pas de soi. Dès l'entrée à l'école, la langue du pays d'accueil tend à devenir dominante ; l'enfant comprend la langue familiale mais répond en français, puis finit, parfois, par cesser de la comprendre. Les familles qui parviennent à maintenir les deux langues sont souvent celles qui leur donnent un espace propre : un parent, une langue ; des séjours réguliers dans le pays d'origine ; des livres, des chansons, des amis avec qui la langue minoritaire a une raison d'être.",
      "L'école, enfin, a son rôle à jouer. Longtemps perçue comme un obstacle, la langue familiale pourrait devenir une ressource, pour peu que les enseignants la reconnaissent et la valorisent. Quelques établissements proposent désormais des activités où chaque élève présente un mot, une comptine ou une recette dans sa langue. Ce geste modeste dit beaucoup : il signifie à l'enfant qu'il n'a pas à choisir entre les mondes qui le constituent."],
    gloss: [["battre en brèche", "to challenge, to demolish"], ["inhiber", "to inhibit"], ["une berceuse", "a lullaby"], ["aller de soi", "to be self-evident"], ["une comptine", "a nursery rhyme"]],
    q: [["What advice did families receive in the mid-20th century?", "To speak only the host country's language", ["To speak only their native language", "To use both languages equally", "To send children abroad"], "« ne parler que la langue du pays d'accueil »", 2],
      ["What was the fear behind that advice?", "That the home language would hinder school success", ["That children would forget their parents", "That schools would refuse them", "That it would be too expensive"], "« de peur que la langue d'origine ne freine leur réussite scolaire »", 2],
      ["What does research over forty years show?", "Bilingual children distinguish the languages early.", ["Bilingual children mix languages permanently.", "Bilingualism harms school results.", "Children can only learn one language well."], "« les enfants bilingues distinguent très tôt les deux langues »", 2],
      ["How does the author present the 'bilingual advantage'?", "As debated among researchers", ["As definitively proven", "As a myth", "As irrelevant"], "« l'ampleur de cet avantage bilingue fait aujourd'hui débat »", 3],
      ["What is said to be beyond debate?", "The emotional and cultural value of the family language", ["The cognitive advantage", "The economic value of languages", "The need to speak French at home"], "« Ce qui ne fait guère débat… c'est la valeur affective et culturelle »", 3],
      ["What often happens when the child starts school?", "The host country's language becomes dominant.", ["The child stops speaking French.", "Parents change language.", "The child forgets both languages."], "« la langue du pays d'accueil tend à devenir dominante »", 2],
      ["Which strategy helps families maintain both languages?", "Giving the minority language its own space", ["Correcting every mistake", "Banning screens", "Speaking only at weekends"], "« leur donnent un espace propre »", 3],
      ["What can school do, according to the author?", "Recognise and value the home language", ["Ignore home languages", "Teach only English", "Separate bilingual pupils"], "« pour peu que les enseignants la reconnaissent et la valorisent »", 3],
      ["What message does the final activity send?", "That the child need not choose between worlds", ["That French is more important", "That recipes matter more than words", "That parents should speak French"], "« il n'a pas à choisir entre les mondes qui le constituent »", 3]] }
];

const LISTENINGS = [
  { id: "l-b1-message", lvl: "B1", exam: true, plays: 2, kind: "CO · voicemail", t: "Un message de l'école de langues",
    intro: "You hear a message on your phone. Read the questions first.",

  { id: "l-b1-weekend", lvl: "B1", exam: true, plays: 2, kind: "CO · conversation", t: "Un week-end à Bruxelles",

  { id: "l-b1-repair", lvl: "B1", exam: true, plays: 2, kind: "CO · radio", t: "Les repair cafés",
    lines: [["Journaliste", "Votre grille-pain ne marche plus ? Avant de le jeter, pensez au repair café ! Le principe est simple : une fois par mois, des bénévoles vous aident à réparer gratuitement vos objets cassés."], ["Journaliste", "Nous sommes à Montreuil, dans une salle de quartier. Autour des tables, on répare des lampes, des vêtements, des vélos et même des ordinateurs. Martine, vous êtes bénévole depuis le début ?"], ["Martine", "Oui, depuis quatre ans. J'étais électricienne, et maintenant que je suis à la retraite, j'ai envie de transmettre ce que je sais. Les gens ne viennent pas seulement pour faire réparer : ils apprennent à le faire eux-mêmes."], ["Journaliste", "Et ça marche ?"], ["Martine", "Plutôt bien ! On répare environ deux objets sur trois. Et puis, c'est convivial : on boit un café, on discute. Ici, on ne jette plus, on répare."], ["Journaliste", "Le prochain repair café de Montreuil aura lieu le premier samedi du mois, de quatorze à dix-huit heures. L'entrée est libre."]],

      ["What was Martine's job?", "Electrician", ["Teacher", "Journalist", "Café owner"], "« J'étais électricienne »", 1],
      ["What do people also do there, according to Martine?", "Learn to repair things themselves", ["Buy new appliances", "Sell their objects", "Take a course in electronics"], "« ils apprennent à le faire eux-mêmes »", 2],

      ["When is the next repair café?", "The first Saturday of the month, 2–6 pm", ["Every Sunday morning", "The last Friday of the month", "Every evening"], "« le premier samedi du mois, de quatorze à dix-huit heures »", 1]] },

  { id: "l-b1-pharmacie", lvl: "B1", kind: "dialogue", t: "À la pharmacie",
    lines: [["Pharmacienne", "Bonjour madame, je peux vous aider ?"], ["Lan Anh", "Bonjour. J'ai mal à la gorge depuis deux jours et je tousse un peu la nuit."], ["Pharmacienne", "Vous avez de la fièvre ?"], ["Lan Anh", "Non, je ne crois pas. Je me suis seulement sentie un peu fatiguée hier."], ["Pharmacienne", "Je vous conseille ces pastilles, trois ou quatre par jour, et ce sirop pour la toux, le soir avant de vous coucher. Si ça ne va pas mieux dans trois jours, il faudra consulter un médecin."], ["Lan Anh", "D'accord, merci beaucoup. Ça fait combien ?"], ["Pharmacienne", "Douze euros quarante, s'il vous plaît."]],

  { id: "l-b2-toits", lvl: "B2", exam: true, plays: 2, kind: "CO · interview", t: "Des jardins sur les toits",
    lines: [["Journaliste", "Bonjour Inès Morel. Vous êtes urbaniste et vous travaillez depuis dix ans sur la végétalisation des villes. Les toits végétalisés, est-ce une mode ou une vraie solution ?"], ["Inès Morel", "Ni l'un ni l'autre, je dirais. C'est un outil parmi d'autres. Un toit couvert de plantes absorbe une partie de l'eau de pluie, ce qui soulage les réseaux d'égouts lors des orages. Il isole aussi le bâtiment : en été, la température sous un toit végétalisé peut être nettement plus basse que sous un toit en zinc."], ["Journaliste", "Donc c'est efficace contre la chaleur ?"], ["Inès Morel", "À l'échelle d'un immeuble, oui. À l'échelle d'une ville, c'est plus compliqué. Pour faire baisser la température d'un quartier, il faut surtout des arbres en pleine terre, de l'ombre au niveau de la rue, là où les gens marchent. Un toit végétalisé au sixième étage ne rafraîchit pas beaucoup le trottoir."], ["Journaliste", "Et les potagers sur les toits, dont on parle beaucoup ?"], ["Inès Morel", "Ils ont un intérêt pédagogique et social énorme : on y organise des ateliers, les écoles viennent, les voisins se rencontrent. En revanche, il ne faut pas imaginer qu'ils nourriront Paris. Leur production reste symbolique."], ["Journaliste", "Qu'est-ce qui freine leur développement ?"], ["Inès Morel", "D'abord, tous les toits ne peuvent pas supporter le poids de la terre et de l'eau ; il faut souvent renforcer la structure, ce qui coûte cher. Ensuite, il y a l'entretien : un toit végétalisé mal entretenu devient vite un toit de mauvaises herbes. Enfin, il faut convaincre les copropriétés, et ça, c'est parfois le plus long !"]],
    q: [["How does Inès Morel describe green roofs?", "As one tool among others", ["As a passing fashion", "As the perfect solution", "As too expensive to consider"], "« C'est un outil parmi d'autres. »", 2],
      ["What happens to rainwater on a green roof?", "Part of it is absorbed.", ["It is stored for drinking.", "It runs faster into the sewers.", "It evaporates immediately."], "« absorbe une partie de l'eau de pluie »", 2],
      ["What is most effective to cool a whole neighbourhood?", "Trees planted in the ground at street level", ["Green roofs on every building", "Air conditioning", "White paint on roofs"], "« des arbres en pleine terre, de l'ombre au niveau de la rue »", 3],
      ["What is the main value of rooftop vegetable gardens?", "Educational and social", ["Feeding the city", "Producing energy", "Reducing taxes"], "« un intérêt pédagogique et social énorme »", 2],
      ["What does she say about their food production?", "It remains symbolic.", ["It could feed Paris.", "It is growing fast.", "It is sold in supermarkets."], "« Leur production reste symbolique. »", 2],
      ["Which obstacle does she mention first?", "Roofs may not support the weight.", ["Plants die in winter.", "Neighbours complain about noise.", "It is illegal in Paris."], "« tous les toits ne peuvent pas supporter le poids »", 2],
      ["What is sometimes the longest step?", "Convincing the co-owners of the building", ["Finding plants", "Training gardeners", "Getting rain"], "« il faut convaincre les copropriétés… c'est parfois le plus long »", 2]] },

  { id: "l-b2-debat", lvl: "B2", exam: true, plays: 2, kind: "CO · radio debate", t: "Faut-il interdire le téléphone au collège ?",
    lines: [["Animatrice", "Bonsoir à tous. Depuis la rentrée, plusieurs collèges testent une pause numérique : les élèves déposent leur téléphone le matin et le récupèrent le soir. Avec nous, Paul Garnier, principal d'un collège à Nantes, et Leïla Benali, représentante d'une association de parents d'élèves."], ["Paul Garnier", "Dans mon établissement, les résultats sont clairs : moins de conflits dans la cour, moins de harcèlement en ligne pendant la journée, et des élèves qui se parlent à nouveau pendant les récréations. Les enseignants constatent aussi une meilleure attention en classe."], ["Leïla Benali", "Je ne conteste pas ces observations. Mais je m'interroge : interdire, est-ce éduquer ? Une fois sortis du collège, les jeunes retrouvent leur téléphone, et personne ne leur a appris à s'en servir de manière raisonnable."], ["Paul Garnier", "C'est justement pour ça que nous proposons, en parallèle, des ateliers d'éducation aux médias. La pause numérique n'est pas une fin en soi ; c'est un cadre."], ["Leïla Benali", "Alors je suis d'accord, à condition que ce cadre soit expliqué aux familles. Beaucoup de parents s'inquiètent de ne pas pouvoir joindre leur enfant en cas d'urgence."], ["Paul Garnier", "Le collège reste joignable à tout moment, et les élèves peuvent appeler depuis le bureau de la vie scolaire. Mais vous avez raison : la communication avec les familles est essentielle."]],
    q: [["What is the 'pause numérique'?", "Pupils hand in their phones in the morning and get them back in the evening.", ["Phones are banned at home.", "Pupils can use phones only in class.", "Teachers take pupils' phones for a week."], "« les élèves déposent leur téléphone le matin et le récupèrent le soir »", 2],
      ["Which positive effect does Paul Garnier NOT mention?", "Better exam results", ["Fewer conflicts in the playground", "Less online harassment", "Better attention in class"], "He mentions the other three.", 2],
      ["What is Leïla Benali's main reservation?", "Banning is not the same as educating.", ["The ban is illegal.", "Teachers use their phones.", "Pupils will buy two phones."], "« interdire, est-ce éduquer ? »", 2],
      ["What does the school offer alongside the ban?", "Media education workshops", ["Free tablets", "Longer breaks", "Phone lockers at home"], "« des ateliers d'éducation aux médias »", 2],
      ["What worries many parents?", "Not being able to reach their child in an emergency", ["The cost of the scheme", "Pupils becoming bored", "Losing the phones"], "« de ne pas pouvoir joindre leur enfant en cas d'urgence »", 2],
      ["How would you describe the end of the debate?", "A partial agreement", ["A total disagreement", "An angry argument", "A change of subject"], "Both agree on the importance of explaining the rules to families.", 2]] },

  { id: "l-b2-reunion", lvl: "B2", kind: "work meeting", t: "Réunion de projet : un module en ligne",
    lines: [["Mehdi", "Bon, on fait le point sur le module d'accueil des nouveaux salariés. Lan Anh, où en est-on ?"], ["Lan Anh", "Le scénario pédagogique est validé. Les vidéos seront tournées la semaine prochaine, et j'aurai terminé les quiz d'ici vendredi."], ["Mehdi", "Parfait. Et les retours des testeurs ?"], ["Lan Anh", "Globalement positifs. En revanche, plusieurs personnes ont trouvé la deuxième partie trop longue. Je propose de la découper en deux séquences de dix minutes."], ["Mehdi", "D'accord, à condition que ça ne retarde pas la mise en ligne. On reste sur le 1er mars ?"], ["Lan Anh", "Oui, ça reste faisable, à moins que le service juridique ne demande d'autres modifications."]],

  { id: "l-c1-conf", lvl: "C1", exam: true, plays: 2, kind: "CO · long document (lecture)", t: "La ville du quart d'heure",
    intro: "You will hear an extract from a lecture. In the real exam the long document lasts about eight minutes and is heard twice.",
    lines: [["Conférencière", "Mesdames et messieurs, bonsoir. Le concept dont je voudrais vous parler ce soir a connu, depuis quelques années, une fortune médiatique considérable : celui de la « ville du quart d'heure ». L'idée en est simple, du moins en apparence : chaque habitant devrait pouvoir accéder, en un quart d'heure à pied ou à vélo, aux fonctions essentielles de la vie quotidienne — se loger, travailler, s'approvisionner, se soigner, apprendre et se divertir."], ["Conférencière", "Il faut d'abord rappeler que cette idée n'est pas tout à fait neuve. Les villes européennes anciennes étaient, par la force des choses, des villes de proximité : on y faisait tout à pied. C'est l'essor de l'automobile, au milieu du XXe siècle, qui a conduit à séparer les fonctions : ici les logements, là les bureaux, plus loin les centres commerciaux, reliés par des routes. La ville du quart d'heure se présente donc moins comme une invention que comme une correction."], ["Conférencière", "Ses partisans lui prêtent de nombreuses vertus. Écologiques, d'abord : moins de déplacements motorisés, c'est moins d'émissions et moins de bruit. Sociales, ensuite : des commerces et des services de proximité recréent du lien, favorisent les rencontres, rendent la ville plus accueillante pour les personnes âgées ou les enfants. Économiques, enfin : le petit commerce de quartier retrouverait une clientèle."], ["Conférencière", "Pour autant, le modèle suscite des critiques qu'il serait malhonnête d'ignorer. La première tient aux inégalités territoriales : ce qui est réalisable dans un arrondissement dense et bien équipé de Paris l'est beaucoup moins dans une commune périurbaine où les distances sont grandes et les services rares. Le risque est alors de créer une ville à deux vitesses, où seuls les quartiers déjà favorisés bénéficieraient du quart d'heure."], ["Conférencière", "La deuxième critique porte sur l'emploi. On peut rapprocher une boulangerie ou une école ; il est plus difficile de rapprocher un hôpital universitaire ou une usine. Beaucoup d'actifs continueront de traverser l'agglomération pour travailler, et la proximité, pour eux, restera partielle."], ["Conférencière", "Enfin, et c'est sans doute le point le plus délicat, l'amélioration d'un quartier tend à y faire monter les prix de l'immobilier. Un quartier devenu agréable attire de nouveaux habitants plus aisés, et les ménages modestes risquent d'en être chassés. C'est ce qu'on appelle la gentrification."], ["Conférencière", "Faut-il pour autant renoncer ? Je ne le crois pas. Mais il me semble essentiel de considérer la ville du quart d'heure non comme un slogan, mais comme une boussole : une direction vers laquelle tendre, en l'adaptant à chaque territoire, et en l'accompagnant de politiques du logement qui protègent ceux qu'elle prétend servir."]],
    q: [["How does the speaker define the 'quarter-hour city'?", "Access to essential functions within 15 minutes on foot or by bike", ["A city that can be crossed by car in 15 minutes", "A city with metro stations every 15 minutes", "A city that is built in 15 years"], "« accéder, en un quart d'heure à pied ou à vélo, aux fonctions essentielles »", 2],
      ["Why does she say the idea is not entirely new?", "Old European cities were already cities of proximity.", ["It was invented in the 1950s.", "Paris has always been divided into zones.", "Cars were invented to save time."], "« Les villes européennes anciennes étaient… des villes de proximité »", 2],
      ["What separated urban functions in the 20th century?", "The rise of the car", ["The rise of the railway", "World wars", "Online shopping"], "« C'est l'essor de l'automobile… qui a conduit à séparer les fonctions »", 2],
      ["How does she present the concept?", "Less as an invention than as a correction", ["As a completely new utopia", "As a failed experiment", "As a purely economic project"], "« moins comme une invention que comme une correction »", 3],
      ["Which social benefit is mentioned?", "Recreating social ties", ["Lower taxes", "More parking spaces", "Faster commuting by car"], "« des commerces et des services de proximité recréent du lien »", 2],
      ["What is the first criticism?", "Territorial inequality between dense and peri-urban areas", ["The cost of bicycles", "The lack of public transport in Paris", "Pollution from bakeries"], "« La première tient aux inégalités territoriales »", 3],
      ["What problem is raised about employment?", "Some jobs, like hospitals or factories, cannot be brought closer.", ["Unemployment will rise.", "Remote work will disappear.", "Shops will close."], "« il est plus difficile de rapprocher un hôpital universitaire ou une usine »", 3],
      ["What is gentrification, as described here?", "Rising prices pushing out modest households", ["Building new parks", "Replacing shops with offices", "Renovating old monuments"], "« les ménages modestes risquent d'en être chassés »", 3],
      ["What is the speaker's conclusion?", "The concept should guide policy, adapted to each area, with housing policies.", ["The concept should be abandoned.", "The concept should be applied identically everywhere.", "The concept is only a slogan."], "« non comme un slogan, mais comme une boussole »", 3]] },

  { id: "l-c1-flashs", lvl: "C1", exam: true, plays: 1, kind: "CO · short radio documents (one listening)", t: "Brèves radiophoniques",

      ["Extract 2: what is offered?", "The first month free, no commitment", ["A free piano", "Lessons at home", "A discount for students"], "« Premier mois offert, sans engagement »", 1],
      ["Extract 3: what proportion supports banning some domestic flights?", "Six in ten", ["Four in ten", "Nine in ten", "Half"], "« six Français sur dix »", 1.5],
      ["Extract 3: which group is more favourable?", "Young people", ["People over 65", "Business travellers", "Pilots"], "« Les plus jeunes y sont nettement plus favorables »", 1.5],
      ["Extract 4: according to the psychologist, boredom…", "may encourage creativity", ["is always harmful", "causes stress", "should be avoided with screens"], "« l'ennui… favoriserait la créativité »", 2]] }

          { t: "Document 1 · Le bureau à la maison, un acquis à défendre", src: "D'après une tribune publiée dans un quotidien", text: ["Quatre ans après sa généralisation forcée, le télétravail s'est installé durablement dans la vie de millions de salariés. Pour ceux qui l'ont adopté, il a d'abord signifié la fin des trajets épuisants : une heure, parfois deux, regagnée chaque jour, consacrée au sommeil, aux enfants ou au sport. Nombre d'entre eux affirment être plus concentrés chez eux qu'en open space, où les interruptions sont permanentes.", "Les bénéfices ne sont pas seulement individuels. Moins de déplacements, c'est moins d'embouteillages et moins d'émissions de gaz à effet de serre. Certaines villes moyennes, autrefois délaissées, voient revenir des habitants qui travaillent à distance pour des entreprises parisiennes, ce qui redonne vie à leurs commerces.", "Remettre en cause ce mode d'organisation au nom d'un prétendu manque de productivité serait donc une erreur. Les études disponibles ne montrent pas de baisse générale de l'efficacité ; elles montrent surtout que le télétravail réussit lorsqu'il est choisi, encadré et fondé sur la confiance."] },

/* ── lesson helpers ─────────────────────────────────────────────── */
const LESSON = {};
LESSONS.forEach((l, i) => { l.n = i; LESSON[l.id] = l; });
const lvlLessons = lv => LESSONS.filter(l => l.lvl === lv);
const trackOf = l => TRACKS[l.tr] || { t: l.tr, en: "" };
const lessonCards = l => (l.cards || []).map((c, i) => ({ fr: c[0], en: c[1], exfr: c[2] || "", exen: c[3] || "", key: l.id + "#" + i, lid: l.id }));
const allCardsOf = lv => LESSONS.filter(l => !lv || l.lvl === lv).flatMap(lessonCards);
function stars(n) { n = n || 0; return `<span class="stars">${[1, 2, 3].map(i => i <= n ? "★" : "<i>★</i>").join("")}</span>`; }
function lessonState(id) { return S.lessons[id] || {}; }
function isDue(id) { const s = lessonState(id); return s.done && s.due && s.due <= Date.now(); }
function nextLesson(lv) {
  const list = lvlLessons(lv || S.level);
  return list.find(l => S.resume[l.id]) || list.find(l => !lessonState(l.id).done) || null;
}

/* ── question builders (plain objects, safe to save) ───────────── */
function optsFrom(right, pool, n = 3) {
  const p = uniq(pool.filter(x => x && norm(x) !== norm(right)));
  const o = shuffle([right, ...pick(p, n)]);
  return { opts: o, a: o.indexOf(right) };
}
function poolEn(l) { return uniq([...lessonCards(l).map(c => c.en), ...LESSONS.filter(x => x.lvl === l.lvl && x !== l).flatMap(x => (x.cards || []).map(c => c[1]))]); }
function poolFr(l) { return uniq([...lessonCards(l).map(c => c.fr), ...LESSONS.filter(x => x.lvl === l.lvl && x !== l).flatMap(x => (x.cards || []).map(c => c[0]))]); }
function sameLessonFirst(l, right, field) {
  const own = lessonCards(l).map(c => c[field]).filter(x => x !== right);
  const other = (field === "en" ? poolEn(l) : poolFr(l)).filter(x => x !== right && !own.includes(x));
  return [...pick(own, 3), ...pick(other, 3)].slice(0, 3);
}
const Q = {
  rec(l, c) { const o = optsFrom(c.en, sameLessonFirst(l, c.en, "en")); return { t: "mc", k: "Recognise", prompt: `<div class="qp">${esc(c.fr)}</div>`, audio: c.fr, ...o, why: c.exfr ? `${c.exfr}<br><span class="en">${esc(c.exen)}</span>` : "", hear: c.fr, cat: "lexique", ik: c.key, lid: l.id, ck: c.key }; },
  recall(l, c) { const o = optsFrom(c.fr, sameLessonFirst(l, c.fr, "fr")); return { t: "mc", k: "Say it in French", prompt: `<div class="qp en" style="font-style:italic">${esc(c.en)}</div>`, ...o, why: c.exfr ? esc(c.exfr) : "", hear: c.fr, cat: "lexique", ik: c.key, lid: l.id, ck: c.key }; },
  listen(l, c) { const o = optsFrom(c.en, sameLessonFirst(l, c.en, "en")); return { t: "mc", k: "Listen", prompt: `<div class="muted small" style="text-align:center">Listen and choose the meaning</div>`, play: c.fr, ...o, why: `<b>${esc(c.fr)}</b>`, hear: c.fr, cat: "écoute", ik: c.key, lid: l.id, ck: c.key }; },
  listenS(l, s, k) { const pool = (l.sent || []).filter(x => x[0] !== s[0]).map(x => x[1]); const o = optsFrom(s[1], pool.length >= 3 ? pool : [...pool, ...poolEn(l)]); return { t: "mc", k: "Listen", prompt: `<div class="muted small" style="text-align:center">Listen and choose the meaning</div>`, play: s[0], ...o, why: `<b>${esc(s[0])}</b>`, hear: s[0], cat: "écoute", ik: k, lid: l.id }; },
  match(l, cs) { return { t: "match", k: "Match the pairs", pairs: cs.map(c => [c.fr, c.en]), cat: "lexique", lid: l.id, ik: l.id + "#match" }; },
  nat(l, x, k) { const o = optsFrom(x[0], [x[1]], 1); return { t: "mc", k: "Which one is correct?", prompt: `<div class="muted small">Choose the sentence a French speaker would write.</div>`, ...o, why: x[2], hear: x[0], cat: l.cat, ik: k, lid: l.id }; },
  mcq(l, x, k) { const o = optsFrom(x[1], x[2], 3); return { t: "mc", k: "Choose", prompt: `<div class="qs">${fmtBlank(x[0])}</div>`, ...o, why: x[3] || "", hear: /_{2,}/.test(x[0]) ? fillBlank(x[0], x[1]) : x[1], cat: l.cat, ik: k, lid: l.id }; },
  gapC(l, x, k) { const right = x[1].split("|")[0]; const o = optsFrom(right, x[4] || [], 3); return { t: "mc", k: "Fill the gap", prompt: `<div class="qs">${fmtBlank(x[0])}</div>${x[2] ? `<div class="muted small">(${esc(x[2])})</div>` : ""}${x[3] ? `<div class="qen">${esc(x[3])}</div>` : ""}`, ...o, why: gapWhy(l, x), hear: fillBlank(x[0], right), cat: l.cat, ik: k, lid: l.id }; },
  gapT(l, x, k) { const right = x[1].split("|")[0]; return { t: "type", k: "Type the missing word", prompt: `<div class="qs">${fmtBlank(x[0])}</div>${x[2] ? `<div class="muted small">(${esc(x[2])})</div>` : ""}${x[3] ? `<div class="qen">${esc(x[3])}</div>` : ""}`, acc: x[1], model: right, why: gapWhy(l, x), hear: fillBlank(x[0], right), cat: l.cat, ik: k, lid: l.id, short: true }; },
  fix(l, x, k) { return { t: "fix", k: "Find the mistake", s: x[0], bad: x[1], good: x[2], why: x[3], opts: shuffle([x[2], ...(x[4] || [])]), hear: x[0].replace(x[1], x[2]), cat: l.cat, ik: k, lid: l.id }; },
  build(l, s, k) { return { t: "build", k: "Build the sentence", en: s[1], words: shuffle(tokenize(s[0])), ans: s[0], hear: s[0], cat: "syntaxe", ik: k, lid: l.id }; },
  trans(l, x, k) { return { t: "type", k: "Transform", prompt: `<div class="muted small">${esc(x[0])}</div><div class="qs">${esc(x[1])}</div>`, acc: x[2], model: x[2].split("|")[0], why: "", hear: x[2].split("|")[0], self: true, cat: l.cat, ik: k, lid: l.id }; },
  chat(l, x, k) { const o = optsFrom(x[1], x[2], 3); return { t: "mc", k: "Reply", prompt: `<div class="chatb"><div><div class="who">They say</div><div class="bub">${esc(x[0])}</div></div></div><div class="muted small">Choose the best reply.</div>`, audio: x[0], ...o, why: x[3] || "", hear: x[1], cat: "interaction", ik: k, lid: l.id }; },
  dict(l, s, k) { return { t: "type", k: "Dictation", prompt: `<div class="muted small" style="text-align:center">Listen and write what you hear</div>`, play: s[0], acc: s[0], model: s[0], why: `<span class="en">${esc(s[1])}</span>`, hear: s[0], self: true, long: true, cat: "orthographe", ik: k, lid: l.id }; },
  tr(l, s, k) { return { t: "type", k: "Translate into French", prompt: `<div class="qp en" style="font-style:italic">${esc(s[1])}</div>`, acc: s[0], model: s[0], why: "", hear: s[0], self: true, long: true, cat: l.cat, ik: k, lid: l.id }; },
  speak(l, s, k) { return { t: "speak", k: "Say it aloud", text: s[0], en: s[1], hear: s[0], cat: "oral", ik: k, lid: l.id }; }
};
function fmtBlank(s) { return esc(s).replace(/_{2,}/g, '<span class="blank">?</span>'); }
function fillBlank(s, a) { return String(s).replace(/_{2,}/, a).replace(/\s*\([^)]*\)/g, "").trim(); }
function gapWhy(l, x) { return x[5] || (l.rule && l.rule.h ? esc(l.rule.h) : ""); }

/* ── lesson queue ───────────────────────────────────────────────── */
function lessonQueue(l, mode) {
  const cards = lessonCards(l), sent = l.sent || [];
  const k = (t, i) => l.id + ":" + t + i;
  const take = (arr, t, n) => leastSeen(arr.map((x, i) => ({ x, i })), o => k(t, o.i), n);
  const q = [];
  const C = take(cards, "c", 8).map(o => o.x);
  const sents = take(sent, "s", 10);
  const shortS = sents.filter(o => tokenize(o.x[0]).length <= 12);
  const gaps = take(l.gap || [], "g", 5), fixes = take(l.fix || [], "f", 3), nats = take(l.nat || [], "n", 3),
    mcqs = take(l.mcq || [], "m", 3), trs = take(l.xf || [], "t", 2), chats = take(l.chat || [], "h", 2);
  if (mode === "quick") {
    gaps[0] && q.push(Q.gapT(l, gaps[0].x, k("g", gaps[0].i)));
    mcqs[0] && q.push(Q.mcq(l, mcqs[0].x, k("m", mcqs[0].i)));
    fixes[0] && q.push(Q.fix(l, fixes[0].x, k("f", fixes[0].i)));
    return q;
  }
  if (mode !== "challenge") {
    C[0] && q.push(Q.rec(l, C[0])); C[1] && q.push(Q.rec(l, C[1]));
    if (C[2]) q.push(Q.listen(l, C[2]));
    if (cards.length >= 4) q.push(Q.match(l, pick(cards, 4)));
    C[3] && q.push(Q.recall(l, C[3]));
  }
  nats.slice(0, mode === "challenge" ? 1 : 2).forEach(o => q.push(Q.nat(l, o.x, k("n", o.i))));
  mcqs.slice(0, 2).forEach(o => q.push(Q.mcq(l, o.x, k("m", o.i))));
  chats[0] && q.push(Q.chat(l, chats[0].x, k("h", chats[0].i)));
  gaps.slice(0, mode === "challenge" ? 4 : 3).forEach((o, i) => q.push(i === 0 && mode !== "challenge" ? Q.gapC(l, o.x, k("g", o.i)) : Q.gapT(l, o.x, k("g", o.i))));
  fixes.slice(0, 2).forEach(o => q.push(Q.fix(l, o.x, k("f", o.i))));
  shortS.slice(0, 2).forEach(o => q.push(Q.build(l, o.x, k("s", o.i))));
  trs.slice(0, mode === "challenge" ? 2 : 1).forEach(o => q.push(Q.trans(l, o.x, k("t", o.i))));
  const rest = sents.filter(o => !shortS.slice(0, 2).includes(o));
  const r = rest.length >= 3 ? rest : sents;
  r[0] && q.push(Q.dict(l, r[0].x, k("s", r[0].i)));
  r[1] && q.push(Q.tr(l, r[1].x, k("s", r[1].i)));
  if (mode === "challenge" && r[2]) q.push(Q.dict(l, r[2].x, k("s", r[2].i)));
  (r[2] || r[0]) && q.push(Q.speak(l, (r[2] || r[0]).x, k("s", (r[2] || r[0]).i)));
  chats[1] && q.push(Q.chat(l, chats[1].x, k("h", chats[1].i)));
  return q;
}

/* ── sessions ───────────────────────────────────────────────────── */
function startSession(o) {
  if (!o.qs || !o.qs.length) { toast("Nothing to practise here yet"); return; }
  SS = Object.assign({ i: 0, res: [], wrong: [], repair: false, title: "Practice" }, o);
  document.body.classList.add("insession");
  renderQ();
}
function saveResume() {
  if (!SS || !SS.lid || SS.kind !== "lesson" || SS.i === 0 || SS.done) return;
  S.resume[SS.lid] = { qs: SS.qs, i: SS.i, res: SS.res, wrong: SS.wrong, mode: SS.mode, repair: SS.repair, at: Date.now() };
  const ids = Object.keys(S.resume).sort((a, b) => S.resume[b].at - S.resume[a].at);
  ids.slice(6).forEach(id => delete S.resume[id]);
  saveNow();
}
A.quitSession = () => {
  TTS.stop();
  if (SS && SS.kind === "lesson" && SS.i > 0 && !SS.done) { saveResume(); toast(`Saved at question ${SS.i + 1}`); }
  SS = null; document.body.classList.remove("insession"); $("#fb").classList.remove("on");
  render();
  return true;
};
function sessTop() {

function accentBar() { return `<div class="accents">${["é", "è", "ê", "à", "â", "ù", "û", "ô", "î", "ï", "ç", "œ", "ë", "É"].map(c => `<button data-a="acc" data-c="${c}" tabindex="-1">${c}</button>`).join("")}</div>`; }
A.acc = d => { const i = $("#ans"); if (!i) return; const s = i.selectionStart ?? i.value.length, e = i.selectionEnd ?? s; i.value = i.value.slice(0, s) + d.c + i.value.slice(e); i.focus(); i.selectionStart = i.selectionEnd = s + 1; };
A.qplay = d => { const q = SS.qs[SS.i]; say(q.play, { slow: !!d.slow }); };
A.mc = (d, el) => {

  $$(".opt").forEach((b, j) => { b.disabled = true; if (j === q.a) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });

A.checkType = () => {

A.tk = (d, el) => { if (SS.answered) return; SS.built.push(+d.i); el.classList.add("used"); drawBuilt(); };

A.tkOut = d => { if (SS.answered) return; const pos = +d.p; const i = SS.built.splice(pos, 1)[0]; $$(".tiles.bank .tk")[i].classList.remove("used"); drawBuilt(); };
function drawBuilt() { const q = SS.qs[SS.i]; $("#built").innerHTML = SS.built.map((i, p) => `<button class="tk" data-a="tkOut" data-p="${p}">${esc(q.words[i])}</button>`).join(""); }

A.mL = (d, el) => { if (SS.answered) return; $$("#mLc .opt").forEach(b => b.classList.remove("sel")); el.classList.add("sel"); SS.m.sel = +d.i; };
A.mR = (d, el) => {

A.fixTap = (d, el) => {

A.fixOpt = d => {
  if (SS.answered) return; const q = SS.qs[SS.i]; const o = q.opts[+d.i]; const ok = o === q.good;
  $$("#fixOpts .opt").forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.good) b.classList.add("right"); else if (j === +d.i) b.classList.add("wrong"); });

function badIdx(s, bad) {

  toks.forEach((t, i) => { const at = s.indexOf(t.split(" ")[0], pos); const e = at + t.length; if (at < end && e > start) out.push(i); pos = at + 1; });
  return out.length ? out : [0];
}
let recog = null;
A.speakGo = () => {
  const q = SS.qs[SS.i]; if (SS.answered) return;
  if (!SR) { say(q.text); return; }
  TTS.stop(); $("#spkOut").innerHTML = `<span class="recdot"></span> Listening…`;
  recog = listenOnce((alts, err) => {
    if (!alts) { $("#spkOut").textContent = err === "not-allowed" ? "Microphone permission was refused. Rate yourself instead." : "I did not catch that. Try again, or rate yourself."; return; }
    const best = alts.map(a => ({ a, s: similarity(a, q.text) })).sort((x, y) => y.s - x.s)[0];
    const ok = best.s >= 0.75;
    $("#spkOut").innerHTML = `I heard: <b>${esc(best.a)}</b> · ${Math.round(best.s * 100)}%`;
    if (ok) answer(true, { given: best.a, right: q.text });
