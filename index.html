A.selfRate = d => { if (SS.answered) return; const q = SS.qs[SS.i]; answer(d.ok === "1", { given: "", right: q.text || q.model }); };

/* ── answering and feedback ─────────────────────────────────────── */
function answer(ok, o = {}) {
  const q = SS.qs[SS.i]; SS.answered = true; SS.last = { ok, o };
  if (q.ik) seenBump(q.ik);
  logAnswer();
  if (!o.self || ok) record(ok, o);
  blip(ok);
  showFb(ok, o);
}
function record(ok, o) {
  const q = SS.qs[SS.i];
  SS.res.push(ok ? 1 : 0);
  if (!ok) {
    if (!SS.repair) SS.wrong.push(SS.i);
    S.mistakes.unshift({ t: Date.now(), q, given: o.given || "", cat: q.cat || "autre", lid: q.lid || "", type: q.t });
    S.mistakes = S.mistakes.slice(0, 160);
  } else if (o.accent) {
    S.mistakes.unshift({ t: Date.now(), q, given: o.given || "", cat: "accents", lid: q.lid || "", type: q.t, soft: true });
    S.mistakes = S.mistakes.slice(0, 160);
  }
  if (q.ck) cardUpdate(q.ck, ok);
  save();
}
function showFb(ok, o) {
  const q = SS.qs[SS.i]; const fb = $("#fb");
  let html;
  if (o.self && !ok) {
    html = `<h4>Compare with the model</h4>
      <div class="muted small">You wrote</div><div class="ans" style="font-weight:500">${esc(o.given)}</div>
      <div class="muted small" style="margin-top:6px">Model ${o.sim != null ? `· ${Math.round(o.sim * 100)}% of words match` : ""}</div><div class="ans">${esc(q.model)}</div>
      ${q.why ? `<div class="why">${q.why}</div>` : ""}
      <div class="row" style="margin-top:10px">${spkBtn(q.hear || q.model)}<button class="btn primary" style="flex:1" data-a="selfFb" data-ok="1">Mine is also right</button><button class="btn" style="flex:1" data-a="selfFb" data-ok="0">I made a mistake</button></div>`;
    fb.className = "sheet-fb on";
  } else {
    const title = ok ? (o.accent ? "Correct — check the accents" : pick(["Bien joué !", "Exactement !", "Parfait !", "C'est ça !", "Très bien !"], 1)[0]) : pick(["Pas tout à fait", "Presque…", "Pas encore"], 1)[0];
    const showAns = !ok || o.accent || q.t === "type" || q.t === "fix" || q.t === "build";

      ${showAns && o.right ? `<div class="ans">${esc(o.right)}</div>` : ""}

      <div class="row" style="margin-top:10px">${q.hear ? spkBtn(q.hear) : ""}<button class="btn primary" style="flex:1" data-a="next">Continue →</button></div>`;
    fb.className = "sheet-fb on " + (ok ? "ok" : "no");

}
A.selfFb = d => { const ok = d.ok === "1"; record(ok, SS.last.o); blip(ok); A.next(); };
A.next = () => {
  $("#fb").classList.remove("on"); TTS.stop();
  if (recog) { try { recog.abort(); } catch (e) { } recog = null; }
  SS.i++;
  if (SS.i >= SS.qs.length) {
    if (!SS.repair && SS.wrong.length && SS.noRepair !== true) {
      SS.mainRes = SS.res.slice(); SS.repair = true;
      SS.qs = SS.wrong.slice(0, 8).map(i => SS.qs[i]); SS.wrong = []; SS.i = 0; SS.res = [];

    }

};
function finishSession() {
  SS.done = true;

  const score = Math.round(100 * res.reduce((a, b) => a + b, 0) / n);
  const st = score >= 90 ? 3 : score >= 75 ? 2 : 1;
  const r = SS.onDone ? (SS.onDone(score, st) || {}) : {};
  if (SS.lid) delete S.resume[SS.lid];
  save();
  const C = 2 * Math.PI * 62;
  $("#stage").innerHTML = `<div class="fade" style="text-align:center;padding-top:20px">
    <svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" stroke="var(--s3)" stroke-width="12" fill="none"/><circle cx="75" cy="75" r="62" stroke="url(#gr)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - score / 100)}" transform="rotate(-90 75 75)" style="transition:stroke-dashoffset 1s"/>
    <defs><linearGradient id="gr"><stop offset="0" stop-color="var(--ok)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>

    <div class="res-h">${score >= 90 ? "Excellent !" : score >= 75 ? "Très bien !" : score >= 50 ? "C'est un bon début" : "On continue !"}</div>

A.endSession = () => { SS = null; document.body.classList.remove("insession"); render(); };

/* ── lessons: start, finish ─────────────────────────────────────── */
A.startLesson = d => {
  const l = LESSON[d.id]; const mode = d.mode || "normal";
  if (d.resume && S.resume[l.id]) {
    const r = S.resume[l.id];
    return startSession({ kind: "lesson", lid: l.id, mode: r.mode, qs: r.qs, i: r.i, res: r.res, wrong: r.wrong, repair: r.repair, title: l.t, onDone: (sc, st) => lessonDone(l, sc, st, r.mode) });
  }
  delete S.resume[l.id];
  startSession({ kind: "lesson", lid: l.id, mode, qs: lessonQueue(l, mode), title: l.t, noRepair: mode === "quick", onDone: (sc, st) => lessonDone(l, sc, st, mode) });
};
function lessonDone(l, score, st, mode) {
  const s = S.lessons[l.id] || {};
  const firstTime = !s.done;
  if (mode === "quick") {
    if (score < 100) return { msg: "Not quite yet — do the full lesson to lock it in." };
    st = 2;
  }
  s.done = true; s.runs = (s.runs || 0) + 1; s.last = Date.now();
  s.stars = Math.max(s.stars || 0, st); s.best = Math.max(s.best || 0, score);
  s.reviews = firstTime ? 0 : (s.reviews || 0) + (s.due && s.due <= Date.now() ? 1 : 0);
  const iv = [2, 5, 12, 30, 60, 120][Math.min(s.reviews, 5)];
  s.due = Date.now() + iv * DAY * (score < 60 ? 0.5 : 1);
  S.lessons[l.id] = s;
  lessonCards(l).forEach(c => { if (!S.cards[c.key]) S.cards[c.key] = { b: 0, due: Date.now() + DAY, r: 0, w: 0 }; });
  planMark("les"); save();
  const nx = lvlLessons(l.lvl).find(x => !lessonState(x.id).done && x.id !== l.id);
  return {
    msg: `${l.t} · ${firstTime ? (l.cards || []).length + " new cards added to review" : "next review in " + plural(iv, "day", "days")}`,
    extra: nx ? `<button class="btn block" data-a="endThen" data-go="lesson" data-id="${nx.id}">Next: ${esc(nx.t)} →</button>` : ""
  };
}
A.endThen = d => { SS = null; document.body.classList.remove("insession"); stack = [{ view: "learn" }]; go(d.go, { id: d.id }); };

/* ── spaced review of cards ─────────────────────────────────────── */
const BOX_DAYS = [1, 2, 4, 8, 16, 35, 80];
function cardUpdate(key, ok) {
  const c = S.cards[key]; if (!c) return;
  if (ok) { c.r++; c.b = Math.min(c.b + 1, BOX_DAYS.length - 1); c.due = Date.now() + BOX_DAYS[c.b] * DAY; }
  else { c.w++; c.b = Math.max(0, c.b - 2); c.due = Date.now() + 0.4 * DAY; }
}
function dueCards() { const now = Date.now(); return Object.keys(S.cards).filter(k => S.cards[k].due <= now && cardByKey(k)); }
function cardByKey(k) { const [id, i] = k.split("#"); const l = LESSON[id]; if (!l || !l.cards || !l.cards[+i]) return null; return lessonCards(l)[+i]; }
function weakCards() { return Object.keys(S.cards).filter(k => cardByKey(k) && S.cards[k].w >= 2 && S.cards[k].w >= S.cards[k].r / 2); }
function cardQs(keys) {
  return keys.map(k => {
    const c = cardByKey(k), l = LESSON[c.lid], b = S.cards[k].b;
    if (b <= 1) return Math.random() < .6 ? Q.rec(l, c) : Q.listen(l, c);
    if (b <= 3) return Q.recall(l, c);
    return Object.assign({ t: "type", k: "Type it in French", prompt: `<div class="qp en" style="font-style:italic">${esc(c.en)}</div>${c.exen ? `<div class="muted small">${esc(c.exen)}</div>` : ""}`, acc: c.fr, model: c.fr, why: c.exfr ? esc(c.exfr) : "", hear: c.fr, self: c.fr.split(" ").length > 3, cat: "lexique", ik: k, lid: l.id, ck: k });
  });
}
A.reviewCards = d => {
  const keys = d.weak ? pick(weakCards(), 15) : shuffle(dueCards()).slice(0, 20);
  if (!keys.length) { toast(d.weak ? "No weak cards — well done" : "Nothing due right now"); return; }
  startSession({ kind: "cards", title: d.weak ? "Weak cards" : "Card review", qs: cardQs(keys), onDone: sc => { planMark("rev"); return { msg: `${keys.length} cards reviewed` }; } });
};
A.reviewLessons = () => {
  const due = LESSONS.filter(l => isDue(l.id)).slice(0, 5);
  if (!due.length) { toast("No lesson is due for review"); return; }
  const qs = [];
  due.forEach(l => { const q = lessonQueue(l, "challenge"); qs.push(...pick(q.filter(x => ["type", "fix", "mc"].includes(x.t)), 3)); });
  startSession({ kind: "lessonReview", title: "Lesson review", qs: shuffle(qs), onDone: (sc) => {
    due.forEach(l => { const s = S.lessons[l.id]; s.reviews = (s.reviews || 0) + 1; s.due = Date.now() + [2, 5, 12, 30, 60, 120][Math.min(s.reviews, 5)] * DAY * (sc < 60 ? .5 : 1); });
    planMark("rev"); save(); return { msg: due.map(l => l.t).join(" · ") };
  } });
};
A.reviewMistakes = () => {
  const ms = S.mistakes.filter(m => m.q && !m.soft).slice(0, 40);
  const seen = new Set(); const qs = [];
  ms.forEach(m => { const k = m.q.ik || JSON.stringify(m.q).slice(0, 80); if (!seen.has(k) && qs.length < 12) { seen.add(k); qs.push(m.q); } });
  if (!qs.length) { toast("Your mistake notebook is empty"); return; }
  startSession({ kind: "mistakes", title: "Mistake notebook", qs: shuffle(qs), onDone: () => { planMark("rev"); return { msg: "Mistakes revisited" }; } });
};

const LV = ["B1", "B2", "C1"];
const lvBadge = lv => `<span class="badge lv lv-${lv}">${lv}</span>`;
const row = (a, ic, t, s, end = "", data = "") => `<button class="lrow" data-a="${a}" ${data}><div class="ic">${ic}</div><div class="tx"><b>${t}</b>${s ? `<span>${s}</span>` : ""}</div>${end ? `<div class="end">${end}</div>` : ""}${IC.chev}</button>`;
const tile = (a, ic, t, s, data = "", best = "") => `<button class="tile" data-a="${a}" ${data}><div class="ic">${ic}</div><b>${t}</b><span>${s}</span>${best ? `<div class="best">${best}</div>` : ""}</button>`;
A.go = d => go(d.v, Object.assign({}, d));
A.tab = d => tab(d.tab);
A.say = d => say(d.t, { slow: !!d.slow });
A.closeSheet = () => closeSheet();
A.setLevel = d => { S.level = d.lv; save(); const c = cur(); c.lv = d.lv; render(); };

/* ── Today ───────────────────────────────────────────────────────── */
V.today = () => {
  const lv = S.level;
  const resumeIds = Object.keys(S.resume).filter(id => LESSON[id]).sort((a, b) => S.resume[b].at - S.resume[a].at);
  const nx = nextLesson(lv);
  const dueC = dueCards().length, dueL = LESSONS.filter(l => isDue(l.id)).length;
  const plan = S.plan[dayKey()] || {};
  let hero;
  if (resumeIds.length) {
    const l = LESSON[resumeIds[0]], r = S.resume[l.id];
    hero = { k: "Unfinished · " + l.lvl, t: l.t, p: `You stopped at question ${r.i + 1} of ${r.qs.length}.`, btn: `<button class="btn primary" data-a="startLesson" data-id="${l.id}" data-resume="1">Continue ▶</button>`, lv: l.lvl };
  } else if (nx) {
    hero = { k: `Next lesson · ${nx.lvl} · ${trackOf(nx).t}`, t: nx.t, p: nx.en, btn: `<button class="btn primary" data-a="go" data-v="lesson" data-id="${nx.id}">Start →</button>`, lv: nx.lvl };
  } else {
    const nlv = LV[LV.indexOf(lv) + 1];
    hero = { k: `Level ${lv} complete`, t: nlv ? `Ready for ${nlv}?` : "Every lesson is done", p: nlv ? "Move up a level, or test yourself with a mock exam." : "Keep the reviews going and train for the DALF C1.", btn: nlv ? `<button class="btn primary" data-a="setLevelGo" data-lv="${nlv}">Go to ${nlv} →</button>` : `<button class="btn primary" data-a="tab" data-tab="exam">Mock exam →</button>`, lv };
  }
  const sug = suggestion();
  const examLine = examCountdown();
  const idiom = IDIOMS[(Math.floor(Date.now() / DAY)) % IDIOMS.length];
  const known = Object.values(S.cards).filter(c => c.b >= 3).length;
  const done = LESSONS.filter(l => lessonState(l.id).done).length;
  return {
    title: "Aujourd'hui", sub: greet(),
    html: `
    <div class="hero"><div class="k">${esc(hero.k)}</div><h3>${esc(hero.t)}</h3><p>${esc(hero.p)}</p>${hero.btn}
      <div class="stripe"><i style="background:var(--b1)"></i><i style="background:var(--b2)"></i><i style="background:var(--c1)"></i><i style="background:var(--rose)"></i><i style="background:var(--gold)"></i></div></div>
    ${examLine}
    <div class="card plan"><h4>Today's plan</h4>
      <div class="step ${plan.rev ? "done" : ""}"><div class="dot">${plan.rev ? "✓" : 1}</div><div class="tx"><b>Review</b><span>${dueC ? plural(dueC, "card", "cards") + " due" : "No cards due"}${dueL ? " · " + plural(dueL, "lesson", "lessons") + " to revisit" : ""}</span></div>
        <button class="btn sm" data-a="${dueC ? "reviewCards" : dueL ? "reviewLessons" : "reviewMistakes"}">${dueC || dueL ? "Go" : "Mistakes"}</button></div>
      <div class="step ${plan.les ? "done" : ""}"><div class="dot">${plan.les ? "✓" : 2}</div><div class="tx"><b>One lesson</b><span>${nx ? esc(nx.t) : "All done at " + lv}</span></div>
        ${nx ? `<button class="btn sm" data-a="go" data-v="lesson" data-id="${nx.id}">Open</button>` : ""}</div>
      <div class="step ${plan.prac ? "done" : ""}"><div class="dot">${plan.prac ? "✓" : 3}</div><div class="tx"><b>${esc(sug.t)}</b><span>${esc(sug.s)}</span></div>
        <button class="btn sm" data-a="${sug.a}" ${sug.data || ""}>Try</button></div>
    </div>
    <div class="stats3"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${known}</b><span>cards known</span></div><div class="stat"><b>${done}/${LESSONS.length}</b><span>lessons</span></div></div>
    ${resumeIds.length > 1 ? `<h3 class="sec">Unfinished lessons</h3>${resumeIds.slice(1).map(id => row("startLesson", "▶", esc(LESSON[id].t), `Question ${S.resume[id].i + 1}/${S.resume[id].qs.length}`, LESSON[id].lvl, `data-id="${id}" data-resume="1"`)).join("")}` : ""}
    <h3 class="sec">Expression of the day</h3>
    <div class="card"><div class="row between"><div style="flex:1"><div class="fr" style="font-size:18px;font-family:var(--disp)">${esc(idiom[0])}</div><div class="en">${esc(idiom[1])}</div></div>${spkBtn(idiom[0])}</div>
      <div class="small" style="margin-top:10px">${esc(idiom[2])}</div><div class="en small">${esc(idiom[3] || "")}</div></div>
    `
  };
};
A.setLevelGo = d => { S.level = d.lv; save(); tab("learn"); };
function greet() { const h = new Date().getHours(); const n = S.set.name || ""; return (h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir") + (n ? ", " + n : ""); }
function examCountdown() {
  if (!S.set.examDate) return "";
  const d = Math.ceil((new Date(S.set.examDate + "T09:00") - Date.now()) / DAY);
  if (isNaN(d) || d < 0) return "";
  const lv = S.set.examLevel; const nm = EXAMS[lv] ? EXAMS[lv].name : lv;
  return `<button class="lrow" data-a="tab" data-tab="exam"><div class="ic">🎯</div><div class="tx"><b>${esc(nm)} in ${plural(d, "day", "days")}</b><span>${new Date(S.set.examDate).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })} · open the mock tasks</span></div>${IC.chev}</button>`;
}
function suggestion() {
  const list = [
    { t: "Listening", s: "A recording at your level, with questions", a: "go", data: 'data-v="listenList"' },
    { t: "Conjugation sprint", s: "Ten verbs in the tenses of your level", a: "conjStart" },
    { t: "Dictation", s: "Five sentences, accents included", a: "dictStart" },
    { t: "Reading", s: "A text at your level, with questions", a: "go", data: 'data-v="readList"' },
    { t: "Speak for one minute", s: "A topic, a timer and your recording", a: "go", data: 'data-v="speakList"' },
    { t: "Connectors", s: "The words that structure an argument", a: "connStart" },
    { t: "Numbers and prices", s: "Hear them, type them", a: "numStart" },
    { t: "Register", s: "Familier, courant, soutenu", a: "regStart" }
  ];
  return list[Math.floor(Date.now() / DAY) % list.length];
}

/* ── Learn ───────────────────────────────────────────────────────── */
V.learn = c => {
  const lv = c.lv || S.level; const L = lvlLessons(lv); const meta = LEVELS[lv];
  const done = L.filter(l => lessonState(l.id).done).length;
  const nx = nextLesson(lv);
  const tracks = uniq(L.map(l => l.tr));
  const dueL = L.filter(l => isDue(l.id)).length;
  return {
    title: "Apprendre", sub: `${meta.name} · ${done}/${L.length} lessons`,
    html: `<div class="seg">${LV.map(x => `<button aria-pressed="${x === lv}" data-a="setLevel" data-lv="${x}">${x}</button>`).join("")}</div>
    <div class="card lv-${lv}" style="border-left:4px solid var(--lv)"><div class="row between"><div><b style="font-size:17px">${esc(meta.name)}</b><div class="muted small">${esc(meta.desc)}</div></div>${lvBadge(lv)}</div>
      <div class="progress" style="margin-top:12px"><i style="width:${Math.round(100 * done / L.length)}%"></i></div>
      <div class="row" style="margin-top:12px">${dueL ? `<button class="btn sm" data-a="reviewLessons">↺ Review ${plural(dueL, "lesson", "lessons")}</button>` : ""}<button class="btn sm ghost" data-a="go" data-v="exam" data-lv="${lv}">${esc(EXAMS[lv].name)} format</button></div></div>
    ${tracks.map(tr => {
      const T = trackOf({ tr }); const items = L.filter(l => l.tr === tr);
      return `<div class="track-h lv-${lv}"><div class="bar"></div><div><b>${esc(T.t)}</b><span>${esc(T.en)}</span></div></div>
      <div class="path lv-${lv}">${items.map(l => {
        const s = lessonState(l.id), r = S.resume[l.id];
        const cls = [s.done ? "done" : "", nx && nx.id === l.id ? "next" : "", isDue(l.id) ? "due" : ""].join(" ");
        return `<button class="node ${cls}" data-a="go" data-v="lesson" data-id="${l.id}"><div class="num">${s.done ? "✓" : L.indexOf(l) + 1}</div><div class="tx"><b>${esc(l.t)}</b><span>${esc(l.en)}</span></div>${r ? `<span class="resume-chip">▶ ${r.i + 1}/${r.qs.length}</span>` : s.done ? stars(s.stars) : ""}</button>`;
      }).join("")}</div>`;
    }).join("")}`
  };
};

/* ── Lesson page ─────────────────────────────────────────────────── */
V.lesson = c => {
  const l = LESSON[c.id]; if (!l) return { html: "Lesson not found" };
  const s = lessonState(l.id), r = S.resume[l.id], R = l.rule || {};
  const reads = (typeof READINGS !== "undefined" ? READINGS : []).filter(x => (x.lessons || []).includes(l.id));
  return {
    title: l.t, sub: `${l.lvl} · ${trackOf(l).t}`,
    html: `<div class="lhead lv-${l.lvl}"><div class="k">${l.lvl} · ${esc(trackOf(l).t)}</div><h3>${esc(l.t)}</h3><p>${esc(l.en)}</p>${s.done ? `<div style="margin-top:8px">${stars(s.stars)} <span class="small" style="opacity:.85">best ${s.best}%</span></div>` : ""}</div>
    ${r ? `<div class="card" style="border-color:rgba(var(--gold-rgb),.5)"><b>You are part-way through this lesson</b><div class="muted small">Question ${r.i + 1} of ${r.qs.length}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-a="startLesson" data-id="${l.id}" data-resume="1">Continue ▶</button><button class="btn ghost" data-a="startLesson" data-id="${l.id}">Start again</button></div></div>` : ""}
    <div class="card"><div class="rule-h">${esc(R.h || "")}</div>
      ${R.pts ? `<ul class="pts">${R.pts.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
      ${(R.ex || []).length ? `<div style="margin-top:12px">${R.ex.map(e => `<button class="ex" data-a="say" data-t="${esc(e[0])}"><span class="spk">${IC.spk}</span><span><span class="fr">${esc(e[0])}</span><span class="en">${esc(e[1])}</span></span></button>`).join("")}</div>` : ""}
      ${R.warn ? `<div class="callout warn"><span class="k">Attention</span>${R.warn}</div>` : ""}
      ${R.vn ? `<div class="callout vn"><span class="k">Cho người Việt</span><span class="vn">${R.vn}</span></div>` : ""}
      ${R.more ? `<details class="more"><summary>More detail</summary><div class="small" style="margin-top:8px">${R.more}</div></details>` : ""}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin:16px 0">
      ${!r ? `<button class="btn primary block" data-a="startLesson" data-id="${l.id}">${s.done ? "Practise again" : "Start the lesson"} · ${lessonQueueLen(l)} questions</button>` : ""}
      <div class="grid2"><button class="btn" data-a="go" data-v="cards" data-id="${l.id}">Flashcards · ${(l.cards || []).length}</button>
      ${s.done ? `<button class="btn" data-a="startLesson" data-id="${l.id}" data-mode="challenge">Challenge</button>` : `<button class="btn" data-a="startLesson" data-id="${l.id}" data-mode="quick">I know this · quick check</button>`}</div>
    </div>
    <h3 class="sec">Sentences to hear</h3>
    <div class="card flat">${(l.sent || []).slice(0, 8).map(e => `<button class="ex" data-a="say" data-t="${esc(e[0])}"><span class="spk">${IC.spk}</span><span><span class="fr">${esc(e[0])}</span><span class="en">${esc(e[1])}</span></span></button>`).join("")}
      ${(l.sent || []).length > 8 ? `<details class="more"><summary>${l.sent.length - 8} more</summary>${l.sent.slice(8).map(e => `<button class="ex" data-a="say" data-t="${esc(e[0])}"><span class="spk">${IC.spk}</span><span><span class="fr">${esc(e[0])}</span><span class="en">${esc(e[1])}</span></span></button>`).join("")}</details>` : ""}</div>
    ${reads.length ? `<h3 class="sec">Read it in context</h3>${reads.map(x => row("go", "📖", esc(x.t), `${x.lvl} · ${x.kind || "text"}`, "", `data-v="read" data-id="${x.id}"`)).join("")}` : ""}`
  };
};
function lessonQueueLen(l) { return lessonQueue(l, "normal").length; }

/* ── Flashcards ─────────────────────────────────────────────────── */
V.cards = c => {
  const l = LESSON[c.id]; const cs = lessonCards(l); const i = clamp(c.i || 0, 0, cs.length - 1); const k = cs[i];
  return {
    title: "Flashcards", sub: l.t,
    html: `<div class="row between"><span class="muted small">${i + 1} / ${cs.length} · tap to flip</span>${spkBtn(k.fr)}</div>
    <div class="fc-wrap"><div class="fc" id="fc" data-a="flip"><div class="face"><div class="w">${esc(k.fr)}</div>${k.exfr ? `<div class="exs muted">${esc(k.exfr)}</div>` : ""}</div>
      <div class="face back"><div class="g">${esc(k.en)}</div>${k.exen ? `<div class="exs"><span class="en">${esc(k.exen)}</span></div>` : ""}</div></div></div>
    <div class="grid2"><button class="btn" data-a="fcMove" data-d="-1" ${i === 0 ? "disabled" : ""}>‹ Previous</button><button class="btn primary" data-a="fcMove" data-d="1">${i === cs.length - 1 ? "Finish" : "Next ›"}</button></div>`,
    after: () => setTimeout(() => say(k.fr), 200)
  };
};
A.flip = () => $("#fc").classList.toggle("flip");
A.fcMove = d => { const c = cur(); const l = LESSON[c.id]; const n = (c.i || 0) + +d.d; if (n >= l.cards.length) { back(); return; } c.i = Math.max(0, n); render(); };

/* ── Me ──────────────────────────────────────────────────────────── */
V.me = () => {
  const cards = Object.values(S.cards);
  const heat = []; for (let i = 83; i >= 0; i--) { const n = S.days[dayKey(new Date(Date.now() - i * DAY))] || 0; heat.push(`<i class="${n >= 60 ? "l3" : n >= 25 ? "l2" : n ? "l1" : ""}" title="${n}"></i>`); }
  const since = Date.now() - 7 * DAY; const ms = S.mistakes.filter(m => m.t >= since);
  const byCat = {}; ms.forEach(m => { byCat[m.cat] = (byCat[m.cat] || 0) + 1; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const byL = {}; ms.forEach(m => { if (m.lid) byL[m.lid] = (byL[m.lid] || 0) + 1; });
  const worstL = Object.entries(byL).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(x => LESSON[x[0]]);
  return {
    title: "Moi", sub: S.set.name ? S.set.name + " · " + S.level : S.level,
    html: `<div class="row between"><h2 class="pg">Progress</h2><button class="ibtn" data-a="go" data-v="settings" aria-label="Settings">${IC.gear}</button></div>
    ${LV.map(lv => { const L = lvlLessons(lv); const d = L.filter(l => lessonState(l.id).done); const st = d.reduce((a, l) => a + (lessonState(l.id).stars || 0), 0);
      return `<div class="card flat lv-${lv}"><div class="row between"><b>${esc(LEVELS[lv].name)}</b>${lvBadge(lv)}</div><div class="progress" style="margin:10px 0 6px"><i style="width:${Math.round(100 * d.length / L.length)}%"></i></div><div class="muted small">${d.length}/${L.length} lessons · ${st}/${L.length * 3} stars · ${Object.keys(S.exam).filter(k => k.startsWith(lv)).length} mock tasks done</div></div>`; }).join("")}
    <div class="stats3"><div class="stat"><b>${cards.length}</b><span>cards</span></div><div class="stat"><b>${cards.filter(c => c.b >= 3).length}</b><span>known</span></div><div class="stat"><b>${streak()}</b><span>day streak</span></div></div>
    <h3 class="sec">Last twelve weeks</h3><div class="card flat"><div class="heat">${heat.join("")}</div></div>
    <h3 class="sec">Error profile · last 7 days</h3>
    <div class="card flat">${cats.length ? cats.map(([k, n]) => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(CAT_LABEL[k] || k)}</span><b>${n}</b></div>`).join("") + (worstL.length ? `<div class="muted small" style="margin-top:10px">Lessons to revisit:</div>${worstL.map(([id, n]) => row("go", "↺", esc(LESSON[id].t), `${plural(n, "mistake", "mistakes")} this week`, LESSON[id].lvl, `data-v="lesson" data-id="${id}"`)).join("")}` : "") : `<span class="muted">No mistakes logged this week.</span>`}
      <div class="row" style="margin-top:10px"><button class="btn sm" data-a="reviewMistakes">Redo my mistakes</button><button class="btn sm ghost" data-a="go" data-v="notebook">Open the notebook</button></div></div>
    <h3 class="sec">I can…</h3>
    ${LV.map(lv => `<div class="card flat"><div class="row between"><b>${lv}</b><span class="muted small">${CANDO.filter(x => x.lvl === lv && canDo(x)).length}/${CANDO.filter(x => x.lvl === lv).length}</span></div>${CANDO.filter(x => x.lvl === lv).map(x => { const i = CANDO.indexOf(x); const ok = canDo(x); return `<label class="chk"><input type="checkbox" data-a="cando" data-i="${i}" ${ok ? "checked" : ""}><span>${esc(x.t)}${x.lessons ? `<span class="muted tiny"> · ${x.lessons.filter(id => lessonState(id).done).length}/${x.lessons.length} lessons</span>` : ""}</span></label>`; }).join("")}</div>`).join("")}
    <h3 class="sec">Report for a teacher</h3>
    <div class="card flat"><p class="small muted" style="margin-top:0">A short weekly summary you can paste into a message.</p><button class="btn sm" data-a="report">Copy this week's report</button></div>`
  };
};
const CAT_LABEL = { temps: "Tenses and moods", subjonctif: "Subjunctive", pronoms: "Pronouns", accords: "Agreement", connecteurs: "Connectors", registre: "Register", lexique: "Vocabulary", syntaxe: "Word order", "écoute": "Listening", orthographe: "Spelling", oral: "Speaking", interaction: "Interaction", accents: "Accents", relatifs: "Relative pronouns", hypothese: "Hypothesis", negation: "Negation", argumentation: "Argument", discours: "Reported speech", conjugaison: "Conjugation", nombres: "Numbers", autre: "Other" };
function canDo(x) { if (S.cando[CANDO.indexOf(x)] != null) return S.cando[CANDO.indexOf(x)]; return x.lessons ? x.lessons.every(id => lessonState(id).done) : false; }
A.cando = (d, el) => { S.cando[d.i] = el.checked; save(); };
A.report = () => {
  const since = Date.now() - 7 * DAY; let ans = 0; for (let i = 0; i < 7; i++) ans += S.days[dayKey(new Date(Date.now() - i * DAY))] || 0;
  const done = LESSONS.filter(l => (lessonState(l.id).last || 0) >= since);
  const ms = S.mistakes.filter(m => m.t >= since && !m.soft); const by = {}; ms.forEach(m => by[m.cat] = (by[m.cat] || 0) + 1);
  const txt = `Pas à pas — weekly report (${dayKey()})\nLearner: ${S.set.name || "-"} · current level: ${S.level}\nAnswers this week: ${ans} · streak: ${streak()} days\nLessons practised: ${done.map(l => l.lvl + " " + l.t).join("; ") || "none"}\nMain error types: ${Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => (CAT_LABEL[k] || k) + " (" + n + ")").join(", ") || "none"}\nRecent mistakes:\n${ms.slice(0, 6).map(m => "- " + (m.q.model || m.q.hear || "") + (m.given ? "  [wrote: " + m.given + "]" : "")).join("\n")}`;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Report copied"), () => openSheet(`<textarea class="inp" rows="14">${esc(txt)}</textarea>`));
};
V.notebook = () => {
  const ms = S.mistakes.slice(0, 60);
  return {
    title: "Mistake notebook", sub: plural(S.mistakes.length, "entry", "entries"),
    html: `<button class="btn primary block" data-a="reviewMistakes" style="margin:10px 0">Redo up to twelve of them</button>
    ${ms.map(m => `<div class="card flat"><div class="row between"><span class="badge lv lv-EX">${esc(CAT_LABEL[m.cat] || m.cat)}</span><span class="muted tiny">${new Date(m.t).toLocaleDateString("en-GB")}</span></div>
      <div style="margin-top:8px;font-weight:600">${esc(m.q.model || (m.q.opts ? m.q.opts[m.q.a] : "") || m.q.hear || "")}</div>${m.given ? `<div class="muted small">You: ${esc(m.given)}</div>` : ""}${m.q.why ? `<div class="small muted" style="margin-top:4px">${m.q.why}</div>` : ""}</div>`).join("") || `<p class="muted">Nothing yet.</p>`}`
  };
};

/* ── Settings ────────────────────────────────────────────────────── */
V.settings = () => {
  TTS.load();
  return {
    title: "Settings", sub: "Pas à pas " + APP_VERSION,
    html: `<div class="card flat">
      <label class="small muted">Name</label><input class="inp" id="setName" value="${esc(S.set.name)}" data-c="setName">
      <div style="height:12px"></div><label class="small muted">Theme</label>
      <div class="seg">${[["auto", "Auto"], ["dark", "Dark"], ["light", "Light"]].map(([k, t]) => `<button aria-pressed="${S.set.theme === k}" data-a="setTheme" data-k="${k}">${t}</button>`).join("")}</div>
    </div>

function numFr(n) {
  const u = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
  const t = ["", "", "vingt", "trente", "quarante", "cinquante", "soixante"];
  const two = n => {
    if (n < 20) return u[n];
    if (n < 70) { const d = Math.floor(n / 10), r = n % 10; return t[d] + (r === 1 ? " et un" : r ? "-" + u[r] : ""); }
    if (n < 80) return n === 71 ? "soixante et onze" : "soixante-" + u[n - 60];
    if (n === 80) return "quatre-vingts";
    return "quatre-vingt-" + u[n - 80];
  };
  const three = n => { const c = Math.floor(n / 100), r = n % 100; let s = c === 0 ? "" : c === 1 ? "cent" : u[c] + " cent" + (r === 0 ? "s" : ""); if (r) s += (s ? " " : "") + two(r); return s || "zéro"; };
  if (n < 1000) return three(n);
  const m = Math.floor(n / 1000), r = n % 1000;
  return (m === 1 ? "mille" : three(m).replace(/cents$/, "cent") + " mille") + (r ? " " + three(r) : "");
}
function numItem() {
  const kind = pick(["n", "n", "price", "phone", "time", "year"], 1)[0]; const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  if (kind === "n") { const n = pick([R(70, 99), R(70, 99), R(100, 999), R(1000, 9999)], 1)[0]; return { tts: numFr(n), acc: [String(n), n.toLocaleString("fr-FR").replace(/ | /g, " ")], model: String(n), k: "Type the number" }; }
  if (kind === "price") { const e = R(2, 99), c = pick([0, 50, 20, 90, 95, 75, 30], 1)[0]; return { tts: numFr(e) + " euros" + (c ? " " + numFr(c) : ""), acc: [`${e},${String(c).padStart(2, "0")}`, `${e}.${String(c).padStart(2, "0")}`, ...(c ? [] : [String(e)])], model: `${e},${String(c).padStart(2, "0")} €`, k: "Type the price (e.g. 12,50)" }; }
  if (kind === "phone") { const g = [pick(["06", "07", "01"], 1)[0], ...[1, 2, 3, 4].map(() => String(R(10, 99)))]; return { tts: g.map(x => x === "06" ? "zéro six" : x === "07" ? "zéro sept" : x === "01" ? "zéro un" : numFr(+x)).join(", "), acc: [g.join(" "), g.join(""), g.join(".")], model: g.join(" "), k: "Type the phone number" }; }
  if (kind === "time") { const h = R(7, 23), m = pick([5, 10, 15, 20, 25, 30, 40, 45, 50, 55], 1)[0]; return { tts: numFr(h) + (h === 1 ? " heure " : " heures ") + numFr(m), acc: [`${h}h${m}`, `${h}:${m}`, `${h} h ${m}`, `${h}h ${m}`], model: `${h} h ${m}`, k: "Type the time (e.g. 14h45)" }; }
  const y = R(1950, 2030); return { tts: numFr(y), acc: [String(y)], model: String(y), k: "Type the year" };
}

const TENSE_SETS = { B1: ["pres", "pc", "imp", "fut", "cond", "subj"], B2: ["pres", "pc", "imp", "pqp", "fut", "futant", "cond", "condp", "subj"], C1: ["imp", "pqp", "futant", "condp", "subj", "subjp", "ps"] };

    return { t: "type", k: TENSES[t].fr, prompt: `<div class="qs">${esc(pr)} <span class="blank">?</span></div><div class="muted small">${esc(v)} · ${esc(TENSES[t].fr)} <span class="en">(${esc(TENSES[t].en)})</span></div>`, acc: f, model: f0, why: `<b>${esc(v)}</b> · ${esc(TENSES[t].fr)}<br>${conjTableHtml(v, t)}`, hear, short: true, cat: "conjugaison" };
  });

function elide(pro, form) { if (/^je$/.test(pro) && /^[aeiouéèêhâîôy]/i.test(form)) return "j'"; if (/^que je$/.test(pro) && /^[aeiouéèêhâîôy]/i.test(form)) return "que j'"; return pro; }
function conjWithPro(pro, f) { const e = elide(pro, f); return /'$/.test(e) ? e + f : e + " " + f; }
function conjTableHtml(v, t) { const f = conj(v, t); const P = PRON[t === "subj" || t === "subjp" ? "subj" : "std"]; return `<table class="fmt conj" style="margin-top:6px">${f.map((x, i) => `<tr><td class="muted">${esc(elide(P[i], x))}</td><td><b>${esc(x.split("|")[0])}</b></td></tr>`).join("")}</table>`; }
V.conjTable = c => {
  const v = c.verb || "venir";
  return {
    title: "Verb tables", sub: v,
    html: `<select class="inp" data-c="conjPick" style="margin-top:12px">${Object.keys(VERBS).sort((a, b) => a.localeCompare(b, "fr")).map(x => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select>
    <div class="muted small" style="margin:8px 0">${esc(VERBS[v].en)} · auxiliary <b>${VERBS[v].aux === "e" ? "être" : "avoir"}</b> · past participle <b>${esc(VERBS[v].pp)}</b></div>
    ${Object.keys(TENSES).map(t => `<div class="card flat"><div class="row between"><b>${esc(TENSES[t].fr)}</b><span class="en small">${esc(TENSES[t].en)}</span></div>${conjTableHtml(v, t)}</div>`).join("")}`

};

/* ── Connectors, register, false friends, expressions ───────────── */
A.connStart = () => {
  const lv = S.level; const pool = CONNECTORS.filter(c => c[5] <= lv || lv === "C1");
  const qs = pick(pool, 10).map((c, i) => {
    if (i % 2 === 0) {
      const o = optsFrom(FN[c[1]], Object.values(FN), 3);
      return { t: "mc", k: "What does it express?", prompt: `<div class="qp">${esc(c[0])}</div><div class="muted small">${esc(c[2])}</div>`, ...o, why: `${esc(c[3])}<br><span class="en">${esc(c[4])}</span>`, hear: c[3], cat: "connecteurs" };
    }
    const others = CONNECTORS.filter(x => x[1] !== c[1] && x[2] === c[2]).map(x => x[0]);
    const o = optsFrom(c[0], others.length >= 3 ? others : CONNECTORS.filter(x => x[1] !== c[1]).map(x => x[0]), 3);
    const s = c[3].replace(connRe(c[0]), m => /'$/.test(m) ? "____ " : "____");
    return { t: "mc", k: "Choose the connector", prompt: `<div class="qs">${fmtBlank(s)}</div><div class="qen">${esc(c[4])}</div>`, ...o, why: `<b>${esc(c[0])}</b> — ${esc(FN[c[1]])} · ${esc(c[2])}`, hear: c[3], cat: "connecteurs" };
  });
  startSession({ kind: "tool", title: "Connectors", qs, onDone: sc => { bestSet("conn", sc); return { msg: "Connectors · " + lv }; } });
};
function connRe(w) { return new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/que$/, "qu(?:e|')"), "i"); }
A.regStart = () => {
  const qs = pick(REGISTERS, 10).map((r, i) => {
    if (i % 3 === 2) { const o = optsFrom(r[0], [r[1], r[2]], 2); return { t: "mc", k: "Which one is familier?", prompt: `<div class="qen">${esc(r[3])}</div>`, ...o, why: `familier: <b>${esc(r[0])}</b><br>courant: ${esc(r[1])}<br>soutenu: ${esc(r[2])}`, hear: r[0], cat: "registre" }; }
    const other = REGISTERS.filter(x => x !== r).map(x => x[2]);
    const o = optsFrom(r[2], [r[0], ...pick(other, 2)], 3);
    return { t: "mc", k: "Say it in a formal register", prompt: `<div class="qp">${esc(r[1])}</div><div class="qen">${esc(r[3])}</div>`, ...o, why: `familier: ${esc(r[0])}<br>courant: ${esc(r[1])}<br>soutenu: <b>${esc(r[2])}</b>`, hear: r[2], cat: "registre" };
  });
  startSession({ kind: "tool", title: "Register", qs, onDone: sc => { bestSet("reg", sc); return { msg: "Familier · courant · soutenu" }; } });
};
A.faStart = () => {
  const qs = pick(FAUXAMIS, 10).map((f, i) => {
    if (i % 2 === 0) { const o = optsFrom(f[1], [f[2], ...pick(FAUXAMIS.filter(x => x !== f).map(x => x[1]), 2)], 3); return { t: "mc", k: "What does it mean?", prompt: `<div class="qp">${esc(f[0])}</div>`, ...o, why: `${esc(f[4])}<br><span class="en">${esc(f[5])}</span><br>“${esc(f[2])}” in French: <b>${esc(f[3])}</b>`, hear: f[4], cat: "lexique" }; }
    const o = optsFrom(f[3], [f[0], ...pick(FAUXAMIS.filter(x => x !== f).map(x => x[3]), 2)], 3);
    return { t: "mc", k: "How do you say it?", prompt: `<div class="qp en" style="font-style:italic">${esc(f[2])}</div>`, ...o, why: `<b>${esc(f[0])}</b> means “${esc(f[1])}”, not “${esc(f[2])}”.`, hear: f[3], cat: "lexique" };

};
A.idStart = () => {
  const lv = S.level; const pool = IDIOMS.filter(x => (x[4] || "B1") <= lv || lv === "C1");
  const qs = pick(pool, 10).map((x, i) => {
    if (i % 2) { const o = optsFrom(x[0], pool.filter(y => y !== x).map(y => y[0]), 3); return { t: "mc", k: "Which expression?", prompt: `<div class="qp en" style="font-style:italic">${esc(x[1])}</div>`, ...o, why: `${esc(x[2])}<br><span class="en">${esc(x[3])}</span>`, hear: x[2], cat: "lexique" }; }
    const o = optsFrom(x[1], pool.filter(y => y !== x).map(y => y[1]), 3);

/* ── timers and recorder (shared with the exam) ─────────────────── */
const TM = { id: 0, left: 0, run: false, el: null };
function timerHtml(sec, label = "") { TM.left = sec; TM.total = sec; TM.run = false; clearInterval(TM.id); return `<div class="card flat" style="text-align:center"><div class="muted small">${esc(label)}</div><div class="timer" id="tm">${fmtT(sec)}</div><div class="row" style="justify-content:center"><button class="btn sm" data-a="tmGo" id="tmB">Start</button><button class="btn sm ghost" data-a="tmReset">Reset</button></div></div>`; }
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
A.tmGo = () => {
  TM.run = !TM.run; $("#tmB").textContent = TM.run ? "Pause" : "Resume"; clearInterval(TM.id);
  if (TM.run) { const end = Date.now() + TM.left * 1000; TM.id = setInterval(() => { TM.left = (end - Date.now()) / 1000; const e = $("#tm"); if (!e) { clearInterval(TM.id); return; } e.textContent = fmtT(TM.left); if (TM.left <= 0) { clearInterval(TM.id); TM.run = false; blip(true); e.style.color = "var(--rose)"; e.textContent = "0:00"; $("#tmB").textContent = "Done"; toast("Time is up"); } }, 250); }
};
A.tmReset = () => { clearInterval(TM.id); TM.run = false; TM.left = TM.total; $("#tm").textContent = fmtT(TM.total); $("#tm").style.color = ""; $("#tmB").textContent = "Start"; };
function recHtml(key) { return `<div class="card flat"><b>Your recording</b><div class="rec" style="margin-top:8px"><button class="btn sm primary" data-a="recGo" data-k="${esc(key)}" id="recB">● Record</button><button class="btn sm" data-a="recPlay" data-k="${esc(key)}">▶ Play mine</button><span id="recS" class="muted small"></span></div><audio id="recA" class="hide"></audio></div>`; }
A.recGo = async d => {
  if (Rec.mr) { const b = await Rec.stop(); $("#recB").textContent = "● Record again"; $("#recS").textContent = "Saved on this phone"; if (b) await IDB.put(d.k, b); planMark("prac"); logAnswer(1); return; }
  TTS.stop(); if (await Rec.start()) { $("#recB").innerHTML = "■ Stop"; $("#recS").innerHTML = `<span class="recdot"></span> recording`; }
};
A.recPlay = async d => { const b = await IDB.get(d.k).catch(() => null); if (!b) { toast("No recording yet"); return; } const a = $("#recA"); a.src = URL.createObjectURL(b); a.play(); };

  B2: ["I announced my point of view at the start", "I gave two arguments, each with an example", "I used connectors (d'abord, en revanche, c'est pourquoi)", "I used the subjunctive or the conditional at least once", "I concluded and nuanced my position"],
  C1: ["I introduced the topic and a question to answer (problématique)", "I announced a plan in two or three parts", "I linked the parts with transitions", "I used precise, varied vocabulary rather than repeating words", "I nuanced (certes… mais, il n'en demeure pas moins que)", "I concluded and opened the topic"]
};

/* ── exam.js ── */

  return {
    title: "Examen", sub: E.name,

      const P = E.papers.find(p => p.k === k);
      let items = "";
      if (k === "CO") items = co.map(x => row("go", "🎧", esc(x.t), esc(x.kind), mark(x.id), `data-v="listen" data-id="${x.id}" data-exam="1"`)).join("");
      if (k === "CE") items = ce.map(x => row("go", "📖", esc(x.t), esc(x.kind), mark(x.id), `data-v="examRead" data-id="${x.id}"`)).join("");

/* writing paper */

  return {
    title: E.name, sub: "Production écrite",

    ${t.docs ? t.docs.map(d => `<div class="card reading"><div class="muted small" style="margin-bottom:6px">${esc(d.src || "")}</div><h4>${esc(d.t)}</h4>${d.text.map(p => `<p>${esc(p)}</p>`).join("")}</div>`).join("") : ""}

};
CHANGE.gridTick = () => { };
A.peDone = d => { const n = $$('[data-c="gridTick"]').filter(x => x.checked).length, m = $$('[data-c="gridTick"]').length; S.exam[d.k] = { got: n, max: m, date: Date.now() }; planMark("prac"); logAnswer(5); save(); toast(`Saved · ${n}/${m} criteria met`); };

    ${sec("Exposé")}<div class="muted small">${esc(t.speakNote)}</div>${recHtml(key + ":" + i)}
    ${sec("Discussion with the jury")}${d.q.map(q => `<button class="ex" data-a="say" data-t="${esc(q)}"><span class="spk">${IC.spk}</span><span class="fr">${esc(q)}</span></button>`).join("")}`;
  }
  return {
    title: E.name, sub: "Production orale",
    html: `<h2 class="pg">${esc(t.t)}</h2><p class="pg-sub">${esc(t.sub)}</p>${body}
    <div class="card flat"><b>Check against the exam criteria</b>${E.grid.PO.map(g => `<label class="chk"><input type="checkbox" data-c="gridTick"><span>${esc(g)}</span></label>`).join("")}
      <button class="btn sm" data-a="peDone" data-k="${key}" style="margin-top:10px">Save this attempt</button></div>`
  };
};
A.poDoc = d => { cur().n = d.n; render(); };
A.examinerAsk = d => { const t = EXAMS[d.lv].po.find(x => x.id === d.id); say(pick(t.items, 1)[0]); };

/* ── main.js ── */
/* ═══════════════════════════════════════════════════════════════════
   Pas à pas · boot — events, navigation, service worker
   ═══════════════════════════════════════════════════════════════════ */
CAT_LABEL.lecture = "Reading";
function boot() {
  load(); applyTheme();
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", applyTheme);
  $("#nav").innerHTML = TABS.map(t => `<button role="tab" data-tab="${t.id}" aria-label="${esc(t.en)}">${t.ic}<span>${esc(t.fr)}</span></button>`).join("");
  $("#backBtn").innerHTML = IC.back;
  document.addEventListener("click", e => {
    const navB = e.target.closest("#nav button"); if (navB) { if (SS) A.quitSession(); closeSheet(); tab(navB.dataset.tab); return; }
    if (e.target.closest("#backBtn")) { back(); return; }
    if (e.target.id === "scrim") { closeSheet(); return; }
    const el = e.target.closest("[data-a]"); if (!el) return;
    if (el.tagName === "INPUT" && el.type === "checkbox") return;
    const fn = A[el.dataset.a]; if (!fn) return;
    e.preventDefault(); fn(Object.assign({}, el.dataset), el, e);
  });
  document.addEventListener("change", e => { const el = e.target.closest("[data-c]"); if (el && CHANGE[el.dataset.c]) CHANGE[el.dataset.c](el); const a = e.target.closest('input[type=checkbox][data-a]'); if (a && A[a.dataset.a]) A[a.dataset.a](Object.assign({}, a.dataset), a); });
  document.addEventListener("input", e => { const el = e.target.closest('[data-c="draft"]'); if (el) CHANGE.draft(el); });
  /* phone back gesture: one armed history entry, re-armed after each in-app back */
  history.replaceState({ root: 1 }, ""); history.pushState({ armed: 1 }, "");
  addEventListener("popstate", () => { if (back()) history.pushState({ armed: 1 }, ""); });
  addEventListener("pagehide", () => { if (SS) saveResume(); saveNow(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { if (SS) saveResume(); saveNow(); } });
  render();
  setTimeout(() => $("#splash").classList.add("off"), 250);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { });
}
boot();

</script>
